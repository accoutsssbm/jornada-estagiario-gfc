<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha GFC — Sotreq</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FDB913'/><text x='50' y='68' font-size='52' text-anchor='middle' font-family='Arial' font-weight='700' fill='%23232323'>G</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --am:#FDB913; --am-esc:#E3A400; --am-cl:#FFF4D1;
  --gra:#3C3C3C; --car:#232323; --bra:#FFFFFF; --nev:#F4F4F2; --lin:#DCDCD8;
  --txt:#232323; --sub:#5C5C5C; --ver:#C8102E; --ok:#2E7D32; --lar:#C4610A; --azu:#1F5FA8;
  --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bra)}
body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--txt);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azu);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- estrutura (inspirada no Manual de Atualizações) ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--am) 236px,var(--bra) 236px)}
.rail{background:var(--am);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;box-shadow:inset -6px 0 10px -6px rgba(0,0,0,.35)}
.marca{background:var(--car);padding:18px 20px 16px;display:flex;align-items:center;gap:10px;text-decoration:none}
.marca .wm{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.3px;color:#fff;line-height:1}
.marca .wm b{color:var(--am);font-weight:700}
.marca img{max-height:34px;max-width:180px}
.quem{padding:16px 22px 10px;font-size:14px;border-bottom:1px solid rgba(0,0,0,.12)}
.quem strong{display:block;font-size:16px}
.rail nav{padding:8px 0;flex:1;overflow:auto}
.rail nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 22px;color:var(--car);font-weight:600;text-decoration:none;border-left:5px solid transparent}
.rail nav a:hover{background:rgba(0,0,0,.06)}
.rail nav a.ativo{background:rgba(0,0,0,.1);border-left-color:var(--car)}
.badge{background:var(--car);color:var(--am);border-radius:10px;padding:0 8px;font-size:13px;font-weight:700;min-width:22px;text-align:center}
.rail .pe{padding:14px 22px 18px;font-size:12.5px;color:rgba(0,0,0,.7);border-top:1px solid rgba(0,0,0,.12)}
.rail .pe .sync{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.local{background:var(--lar)} .dot.salvando{background:var(--azu)}
.main{min-width:0;display:flex;flex-direction:column}
.topo{background:var(--gra);color:#fff;padding:26px 44px 22px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28)}
.topo h1{font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:clamp(28px,4vw,42px);letter-spacing:.4px;margin:0;line-height:1.02;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.topo p{margin:6px 0 0;color:#E4E4E4;max-width:70ch}
.topo .volta{display:inline-block;color:var(--am);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:6px}
.conteudo{padding:30px 44px 72px;max-width:1140px;width:100%}
.faixa{background:var(--am);padding:14px 20px;font-style:italic;font-weight:500;margin:0 0 26px;border-left:6px solid var(--car)}

h2{font-family:var(--cond);font-weight:700;font-size:26px;text-transform:uppercase;margin:34px 0 12px;line-height:1.1}
h2:first-child{margin-top:0}
h3{font-family:var(--cond);font-weight:600;font-size:20px;margin:22px 0 8px;line-height:1.15}
.sub{color:var(--sub)}
.peq{font-size:14px}
p{margin:0 0 12px;max-width:78ch}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--am);color:var(--car);border:0;border-radius:2px;padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 2px 0 var(--am-esc)}
.btn:hover{filter:brightness(1.04)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.escuro{background:var(--gra);color:#fff;box-shadow:0 2px 0 #1a1a1a}
.btn.linha{background:transparent;box-shadow:inset 0 0 0 2px var(--gra);color:var(--gra)}
.btn.perigo{background:transparent;box-shadow:inset 0 0 0 2px var(--ver);color:var(--ver)}
.btn.mini{padding:5px 11px;font-size:14px}
.acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}

.painel{border:1px solid var(--lin);background:#fff;padding:20px 22px;margin-bottom:18px}
.painel.cinza{background:var(--nev);border-color:transparent}
.grade{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.num{border-top:4px solid var(--am);padding-top:10px}
.num .v{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1}
.num .l{font-size:14px;color:var(--sub)}

label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=url],input[type=email],select,textarea{width:100%;border:1px solid #BDBDB8;background:#fff;padding:9px 11px;border-radius:2px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gra)}
.linha-form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.ajuda{font-size:13px;color:var(--sub);margin-top:4px}

.tabela-wrap{overflow-x:auto;border:1px solid var(--lin)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{background:var(--gra);color:var(--am);text-align:left;font-weight:600;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--lin);vertical-align:top}
tr.fase-sep td{background:var(--nev);font-family:var(--cond);font-weight:700;font-size:16px;text-transform:uppercase}

.st{display:inline-block;padding:2px 9px;font-size:13px;font-weight:600;border-radius:2px;white-space:nowrap}
.st-bloqueado{background:#ECECEA;color:#7a7a7a}
.st-disponivel{background:var(--am-cl);color:#7A5600}
.st-estudo{background:#E3ECF7;color:var(--azu)}
.st-teste{background:var(--am);color:var(--car)}
.st-avaliacao{background:#F1E4F7;color:#6B2C8A}
.st-reciclagem{background:#FBE3D2;color:var(--lar)}
.st-aprovado{background:#DDF0DE;color:var(--ok)}
.st-dispensado{background:#fff;color:#8a8a8a;box-shadow:inset 0 0 0 1px #cfcfcf}

.atencao{border-top:2px solid var(--am);border-bottom:2px solid var(--am);padding:12px 8px;margin:16px 0;text-align:center;font-style:italic}
.atencao b{color:var(--ver);font-weight:700}

.passos{list-style:none;padding:0;margin:0;counter-reset:p}
.passos li{counter-increment:p;display:grid;grid-template-columns:52px 1fr;gap:6px;padding:9px 0;border-bottom:1px dashed var(--lin)}
.passos li::before{content:counter(p) "º";font-family:var(--cond);font-weight:700;font-size:30px;line-height:1;color:var(--gra)}
.lista{margin:0;padding-left:20px}
.lista li{margin-bottom:7px;max-width:78ch}

.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;font-weight:400;font-size:16px;margin:0}
.check input{width:20px;height:20px;accent-color:var(--gra);margin-top:2px;flex:none}

.barra{height:10px;background:#E6E6E2;position:relative;overflow:hidden}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--gra)}
.barra i.am{background:var(--am-esc)}

.aviso{padding:12px 16px;border-left:5px solid var(--lar);background:#FFF3E8;margin:12px 0}
.aviso.ok{border-color:var(--ok);background:#EEF7EE}
.aviso.info{border-color:var(--azu);background:#EEF3FA}
.aviso.erro{border-color:var(--ver);background:#FCEBEE}
.vazio{padding:26px;text-align:center;color:var(--sub);border:2px dashed var(--lin)}

/* ---------- trilha ---------- */
.trilho{position:relative;margin:8px 0 6px}
.fase{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:18px 0;border-top:1px solid var(--lin)}
.fase .fn{font-family:var(--cond);font-weight:700;font-size:15px;text-transform:uppercase;color:var(--sub);line-height:1.2}
.fase .fn b{display:block;font-size:44px;color:var(--gra);line-height:.95}
.estacoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.estacao{display:block;text-decoration:none;border:1px solid var(--lin);padding:12px 14px 13px;background:#fff;position:relative}
.estacao:hover{border-color:var(--gra)}
.estacao .cod{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--sub)}
.estacao .tit{font-weight:600;line-height:1.25;margin:2px 0 8px;display:block}
.estacao.atual{border:2px solid var(--car);box-shadow:5px 5px 0 var(--am)}
.estacao.bloq{opacity:.62}
.estacao.feito{background:var(--nev)}

/* ---------- PDCA ---------- */
.pdca-wrap{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:center}
.pdca svg{width:100%;height:auto;display:block}
.pdca-leg{display:grid;gap:10px}
.pdca-leg div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.pdca-leg b{font-family:var(--cond);font-size:24px;line-height:1;width:34px;height:34px;display:grid;place-items:center;background:#ECECEA;color:#8a8a8a}
.pdca-leg .feito b{background:var(--gra);color:#fff}
.pdca-leg .agora b{background:var(--am);color:var(--car)}
.pdca-leg span{font-size:14.5px}
.pdca-leg strong{display:block;font-size:15px}

.plano{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--lin);margin-bottom:24px}
.plano div{padding:12px 14px;border-left:1px solid var(--lin)}
.plano div:first-child{border-left:0}
.plano small{display:block;color:var(--sub);font-size:13px}
.plano strong{font-family:var(--cond);font-size:22px;line-height:1.1}

/* ---------- questões ---------- */
.questao{border:1px solid var(--lin);padding:18px 20px;margin-bottom:16px;background:#fff}
.questao .qh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
.questao .qn{font-family:var(--cond);font-weight:700;font-size:20px}
.questao .qt{font-size:13px;color:var(--sub);white-space:nowrap}
.questao .enun{font-weight:600;margin-bottom:12px;max-width:80ch}
.opcao{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid transparent;cursor:pointer}
.opcao:hover{background:var(--nev)}
.opcao input{margin-top:4px;accent-color:var(--gra);flex:none}
.opcao.certa{border-color:var(--ok);background:#EEF7EE}
.opcao.errada{border-color:var(--ver);background:#FCEBEE}
.resposta{background:var(--nev);padding:10px 14px;white-space:pre-wrap;border-left:4px solid var(--gra);margin:6px 0}
.gabarito{background:var(--am-cl);padding:10px 14px;border-left:4px solid var(--am-esc);margin:8px 0;font-size:14.5px}
.gabarito b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.comentario{background:#EEF3FA;border-left:4px solid var(--azu);padding:8px 14px;margin-top:8px;font-size:14.5px}
.notaq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.notaq input[type=number]{width:90px}
.resultado{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:18px 22px;background:var(--gra);color:#fff;margin:18px 0}
.resultado .nota{font-family:var(--cond);font-size:56px;font-weight:700;line-height:1;color:var(--am)}
.resultado .rot{font-family:var(--cond);font-size:22px;text-transform:uppercase;font-weight:700}

details.acc{border:1px solid var(--lin);margin-bottom:10px;background:#fff}
details.acc>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-family:var(--cond);font-size:22px;line-height:1}
details.acc[open]>summary::after{content:"–"}
details.acc>.corpo{padding:4px 16px 16px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.login .lado{background:var(--am);padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset -8px 0 14px -8px rgba(0,0,0,.35)}
.login .lado{min-width:0}
.login .lado h1{overflow-wrap:break-word;font-family:var(--cond);font-weight:700;font-size:clamp(42px,5.6vw,80px);line-height:.92;text-transform:uppercase;margin:24px 0 18px;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.login .lado p{font-weight:500;max-width:42ch}
.login .form{padding:48px 44px;display:flex;flex-direction:column;justify-content:center;max-width:560px}
.perfis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}
.perfil{border:2px solid var(--lin);background:#fff;padding:18px 16px;text-align:left;cursor:pointer}
.perfil strong{display:block;font-family:var(--cond);font-size:24px;text-transform:uppercase;line-height:1.1}
.perfil span{font-size:14px;color:var(--sub)}
.perfil[aria-pressed=true]{border-color:var(--car);box-shadow:5px 5px 0 var(--am)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--car);color:#fff;padding:12px 20px;border-left:6px solid var(--am);z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.erro{border-left-color:var(--ver)}
.carregando{min-height:100vh;display:grid;place-items:center;font-family:var(--cond);font-size:26px;text-transform:uppercase;background:var(--am)}

/* ---------- responsivo ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:var(--bra)}
  .rail{position:static;height:auto;box-shadow:none}
  .rail nav{display:flex;overflow-x:auto;padding:0}
  .rail nav a{white-space:nowrap;border-left:0;border-bottom:4px solid transparent;padding:10px 14px}
  .rail nav a.ativo{border-bottom-color:var(--car)}
  .quem,.rail .pe{display:none}
  .topo{padding:22px 20px 18px}
  .conteudo{padding:22px 20px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .fase{grid-template-columns:1fr;gap:8px}
  .fase .fn b{display:inline;font-size:30px;margin-right:6px}
  .pdca-wrap{grid-template-columns:1fr}
  .pdca{max-width:220px}
  .plano{grid-template-columns:1fr 1fr}
  .plano div:nth-child(3){border-left:0}
  .plano div:nth-child(n+3){border-top:1px solid var(--lin)}
  .login{grid-template-columns:1fr}
  .login .lado{padding:30px 22px}
  .login .form{padding:28px 22px}
}
@media (max-width:520px){.g2,.g3,.g4,.perfis{grid-template-columns:1fr}}
@media print{.rail,.acoes,.btn{display:none!important}.app{display:block}.topo{background:#fff;color:#000;box-shadow:none}.topo h1{text-shadow:none}}
</style>
</head>
<body>
<div id="app"><div class="carregando">Carregando a trilha…</div></div>

<script src="config.js"></script>
<script src="curriculo.js"></script>
<script>
"use strict";
/* =====================================================================
   TRILHA GFC — Sotreq · Engenharia de Mineração Norte
   Interface de controle de aprendizagem dos estagiários do GFC, baseada
   no PDCA do plano de imersão. Base de dados: um arquivo JSON versionado
   num repositório GitHub (API de Contents) ou, sem token, no navegador.
   ===================================================================== */

const C = window.CURRICULO;
const CFG = window.GFC_CONFIG || {};
const K_CFG = "gfc_trilha_cfg", K_DB = "gfc_trilha_db", K_SES = "gfc_trilha_sessao", K_RASC = "gfc_trilha_rascunho_";
const S = { db: null, sha: null, user: null, salvando: false, erroCarga: null };

/* ------------------------------ utilidades ------------------------------ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hoje = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmt = s => s ? s.slice(0, 10).split("-").reverse().join("/") : "—";
const fmtHora = s => { if (!s) return "—"; const d = new Date(s); return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); };
const util = d => d.getDay() !== 0 && d.getDay() !== 6;
function addUteis(s, n) { const d = parse(s); let k = 0; while (k < n) { d.setDate(d.getDate() + 1); if (util(d)) k++; } return iso(d); }
function uteisEntre(a, b) { let sinal = 1; if (b < a) { [a, b] = [b, a]; sinal = -1; } const d = parse(a), e = parse(b); let k = 0; while (d < e) { d.setDate(d.getDate() + 1); if (util(d)) k++; } return k * sinal; }
const nota1 = n => (Math.round(n * 10) / 10).toFixed(1).replace(".", ",");
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function hashPin(salt, pin) {
  const txt = `gfc|${salt}|${pin}`;
  if (window.crypto?.subtle) {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  }
  let h = 5381; for (const c of txt) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return "djb" + h.toString(16);
}
function b64enc(str) { const by = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); }
function b64dec(b64) { const bin = atob(b64.replace(/\s/g, "")); const by = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i); return new TextDecoder().decode(by); }
function toast(msg, erro) { $$(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast" + (erro ? " erro" : ""); t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), erro ? 6000 : 3000); }

/* ------------------------------ armazenamento ------------------------------ */
function novoDB() {
  return { versao: 1, criadoEm: new Date().toISOString(), atualizadoEm: null,
    instrutor: { nome: "", pinHash: null }, estagiarios: [], progresso: {}, ajustes: {},
    questoesExtras: {}, questoesOff: {}, encontros: [], log: [] };
}
function migrar(db) {
  const base = novoDB();
  for (const k of Object.keys(base)) if (db[k] === undefined) db[k] = base[k];
  return db;
}
const Store = {
  cfg() {
    const base = Object.assign({ owner: "", repo: "", branch: "main", path: "data/db.json" }, CFG.github || {});
    const salvo = JSON.parse(localStorage.getItem(K_CFG) || "null") || {};
    const c = Object.assign({ modo: base.owner ? "github" : "local", token: "" }, base, salvo);
    if (c.modo === "github" && (!c.owner || !c.repo || !c.token)) c.incompleto = true;
    return c;
  },
  salvarCfg(c) { const { incompleto, ...r } = c; localStorage.setItem(K_CFG, JSON.stringify(r)); },
  url(c) { return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split("/").map(encodeURIComponent).join("/")}`; },
  hdr(c, extra) { return Object.assign({ Accept: "application/vnd.github+json", Authorization: `Bearer ${c.token}`, "X-GitHub-Api-Version": "2022-11-28" }, extra || {}); },
  async ghGet(c = this.cfg()) {
    const u = this.url(c) + `?ref=${encodeURIComponent(c.branch)}&t=${Date.now()}`;
    const r = await fetch(u, { headers: this.hdr(c), cache: "no-store" });
    if (r.status === 404) return { db: null, sha: null };
    if (r.status === 401) throw new Error("Token do GitHub inválido ou expirado. Gere um novo e salve em Configurações.");
    if (r.status === 403) throw new Error("O token não tem permissão de leitura neste repositório (Contents: Read and write).");
    if (!r.ok) throw new Error(`GitHub respondeu ${r.status} ao ler a base.`);
    const j = await r.json();
    let txt;
    if (j.content) txt = b64dec(j.content);
    else { const r2 = await fetch(u, { headers: this.hdr(c, { Accept: "application/vnd.github.raw+json" }), cache: "no-store" }); txt = await r2.text(); }
    return { db: JSON.parse(txt), sha: j.sha };
  },
  async ghPut(db, sha, msg, c = this.cfg()) {
    const body = { message: msg || "Trilha GFC: atualização", content: b64enc(JSON.stringify(db, null, 1)), branch: c.branch };
    if (sha) body.sha = sha;
    const r = await fetch(this.url(c), { method: "PUT", headers: this.hdr(c, { "Content-Type": "application/json" }), body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) { const e = new Error("conflito"); e.conflito = true; throw e; }
    if (r.status === 401 || r.status === 403) throw new Error("O token não tem permissão de escrita neste repositório.");
    if (!r.ok) throw new Error(`GitHub respondeu ${r.status} ao gravar a base.`);
    const j = await r.json(); return j.content.sha;
  },
  async carregar() {
    const c = this.cfg();
    if (c.modo === "github" && !c.incompleto) {
      const { db, sha } = await this.ghGet(c);
      S.db = migrar(db || novoDB()); S.sha = sha;
    } else {
      S.db = migrar(JSON.parse(localStorage.getItem(K_DB) || "null") || novoDB()); S.sha = null;
    }
  },
  async gravar(mut, msg) {
    const c = this.cfg();
    S.salvando = true; atualizarSync();
    try {
      if (c.modo !== "github" || c.incompleto) {
        mut(S.db); S.db.atualizadoEm = new Date().toISOString();
        localStorage.setItem(K_DB, JSON.stringify(S.db)); return;
      }
      for (let i = 0; i < 4; i++) {
        let { db, sha } = await this.ghGet(c);
        db = migrar(db || novoDB()); mut(db); db.atualizadoEm = new Date().toISOString();
        try { S.sha = await this.ghPut(db, sha, msg, c); S.db = db; return; }
        catch (e) { if (e.conflito && i < 3) { await sleep(500 * (i + 1)); continue; } throw e; }
      }
    } finally { S.salvando = false; atualizarSync(); }
  }
};
function registrar(db, acao) {
  const quem = S.user?.tipo === "instrutor" ? (db.instrutor.nome || "Instrutora") : (db.estagiarios.find(e => e.id === S.user?.id)?.nome || "—");
  db.log.unshift({ em: new Date().toISOString(), quem, acao });
  if (db.log.length > 400) db.log.length = 400;
}
async function salvar(mut, msg, ok) {
  try { await Store.gravar(db => { mut(db); registrar(db, msg); }, "Trilha GFC: " + msg); if (ok) toast(ok); render(); return true; }
  catch (e) { console.error(e); toast("Não foi possível salvar: " + e.message, true); render(); return false; }
}
/* gravação agrupada para checklist e anotações (evita um commit por clique) */
let fila = [], filaTimer = null;
function agendar(mut, msg) {
  fila.push(mut); clearTimeout(filaTimer);
  if (Store.cfg().modo !== "github") { mut(S.db); fila = []; localStorage.setItem(K_DB, JSON.stringify(S.db)); return; }
  mut(S.db); atualizarSync(true);
  filaTimer = setTimeout(async () => {
    const muts = fila; fila = [];
    try { await Store.gravar(db => { muts.forEach(m => m(db)); registrar(db, msg); }, "Trilha GFC: " + msg); }
    catch (e) { toast("Não foi possível salvar: " + e.message, true); }
  }, 2200);
}
function atualizarSync(pendente) {
  const el = $("#sync"); if (!el) return;
  const c = Store.cfg(); const gh = c.modo === "github" && !c.incompleto;
  el.innerHTML = S.salvando || pendente ? `<span class="dot salvando"></span>Salvando…`

}

/* ------------------------------ regras da trilha ------------------------------ */
const MODS = C.modulos;
const modPorId = id => MODS.find(m => m.id === id);
const faseDe = n => C.fases.find(f => f.n === n);
const est = id => S.db.estagiarios.find(e => e.id === id);
function ajuste(eid, mid) { const m = modPorId(mid); const a = S.db.ajustes?.[eid]?.[mid] || {}; return { dias: a.dias ?? m.dias, notaMin: a.notaMin ?? m.notaMin, escopo: a.escopo ?? true }; }
function prog(eid, mid) { return S.db.progresso?.[eid]?.[mid] || null; }
function questoesDe(mid) {
  const m = modPorId(mid);
  const extras = (S.db.questoesExtras?.[mid] || []).map(q => ({ ...q, extra: true }));
  return [...m.questoes, ...extras].filter(q => !S.db.questoesOff?.[q.id]);
}
function situacao(eid, mid) {
  const i = MODS.findIndex(m => m.id === mid); const aj = ajuste(eid, mid); const p = prog(eid, mid);
  if (!aj.escopo && (!p || p.status !== "aprovado")) return { st: "dispensado", p, aj };
  if (!p) {
    const liberado = MODS.slice(0, i).every(m => { const s = situacao(eid, m.id).st; return s === "aprovado" || s === "dispensado"; });
    return { st: liberado ? "disponivel" : "bloqueado", p, aj };
  }
  if (p.status === "estudo" || p.status === "reciclagem") {
    const testeOk = p.liberado || hoje() >= p.prazo;
    return { st: testeOk ? "teste" : p.status, base: p.status, p, aj, faltam: Math.max(0, uteisEntre(hoje(), p.prazo)) };
  }
  return { st: p.status, p, aj };
}
const ROT = { bloqueado: "Bloqueado", disponivel: "Pronto para iniciar", estudo: "Em estudo", teste: "Teste liberado", avaliacao: "Aguardando avaliação", reciclagem: "Reciclagem", aprovado: "Aprovado", dispensado: "Fora do escopo" };
const chip = st => `<span class="st st-${st}">${ROT[st]}</span>`;
function etapaPDCA(st) { return { bloqueado: "", disponivel: "P", estudo: "D", reciclagem: "D", teste: "C", avaliacao: "C", aprovado: "A", dispensado: "" }[st] ?? ""; }
function moduloAtual(eid) {
  const ordem = ["avaliacao", "teste", "reciclagem", "estudo", "disponivel"];
  for (const s of ordem) { const m = MODS.find(m => situacao(eid, m.id).st === s); if (m) return m; }
  return null;
}
function calcNota(t) { let tot = 0, ob = 0; for (const q of t.questoes) { tot += q.peso; ob += Number(t.notas?.[q.id]?.nota ?? 0); } return tot ? ob / tot * 10 : 0; }
function indicadores(eid) {
  const e = est(eid); const escopo = MODS.filter(m => ajuste(eid, m.id).escopo || prog(eid, m.id)?.status === "aprovado");
  let aprov = 0, pend = 0, atrasos = [], plan = 0, real = 0, reprov = 0, notas1 = [], gatilhos = [], restantes = 0, total = 0;
  for (const m of escopo) {
    const s = situacao(eid, m.id); const p = s.p; total += s.aj.dias;
    if (p?.tentativas?.length) {
      const av = p.tentativas.filter(t => t.status === "avaliada");
      reprov += av.filter(t => !t.aprovado).length;
      if (av[0]) notas1.push(av[0].nota);
      if (av.filter(t => !t.aprovado).length >= 2 && s.st !== "aprovado") gatilhos.push({ tipo: "ajuste", txt: `${m.id} reprovado 2× — voltar o processo ao modo acompanhado ou reduzir sites.` });
    }
    if (s.st === "aprovado") {
      aprov++; plan += s.aj.dias; real += Math.max(1, uteisEntre(p.inicio, p.aprovadoEm));
      const ult = p.tentativas.at(-1); if (ult && ult.nota >= 9 && p.aprovadoEm < p.prazoOriginal) gatilhos.push({ tipo: "acel", txt: `${m.id} aprovado antes do prazo com ${nota1(ult.nota)} — considerar acelerar a fase.` });
    } else {
      if (s.st === "avaliacao") pend++;
      if ((s.st === "teste") && uteisEntre(p.prazo, hoje()) > 2) atrasos.push({ m, dias: uteisEntre(p.prazo, hoje()) });
      restantes += p && s.st !== "avaliacao" ? Math.max(0, uteisEntre(hoje(), p.prazo)) + 1 : (s.st === "avaliacao" ? 1 : s.aj.dias);
    }
  }
  atrasos.forEach(a => gatilhos.push({ tipo: "ajuste", txt: `${a.m.id}: teste liberado há ${a.dias} dias úteis sem envio — conversar na reunião semanal.` }));
  const fimPlanejado = e?.inicio ? addUteis(e.inicio, total) : null;
  const previsao = aprov === escopo.length ? null : addUteis(hoje(), restantes);
  return { total: escopo.length, aprov, pend, atrasos, reprov, gatilhos,
    media: notas1.length ? notas1.reduce((a, b) => a + b, 0) / notas1.length : null,
    assert: real ? plan / real * 100 : null, fimPlanejado, previsao };
}
function pendentesAvaliacao() {
  const out = [];
  for (const e of S.db.estagiarios) for (const m of MODS) { const p = prog(e.id, m.id); const t = p?.tentativas?.find(t => t.status === "pendente"); if (t) out.push({ e, m, t }); }
  return out.sort((a, b) => a.t.enviadoEm.localeCompare(b.t.enviadoEm));
}

/* ------------------------------ PDCA (anel) ------------------------------ */
function anelPDCA(atual, concluido) {
  const ordem = ["P", "D", "C", "A"]; const ia = ordem.indexOf(atual);
  const cor = (k, i) => concluido || (ia > -1 && i < ia) ? "#3C3C3C" : k === atual ? "#FDB913" : "#E6E6E2";
  const txt = (k, i) => concluido || (ia > -1 && i < ia) ? "#fff" : k === atual ? "#232323" : "#9a9a9a";
  const quad = [["P", "M100,100 L100,8 A92,92 0 0,1 192,100 Z", 146, 74], ["D", "M100,100 L192,100 A92,92 0 0,1 100,192 Z", 146, 150], ["C", "M100,100 L100,192 A92,92 0 0,1 8,100 Z", 54, 150], ["A", "M100,100 L8,100 A92,92 0 0,1 100,8 Z", 54, 74]];
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Ciclo PDCA do módulo: etapa ${atual || "não iniciada"}">
    ${quad.map(([k, d, x, y], i) => `<path d="${d}" fill="${cor(k, i)}" stroke="#fff" stroke-width="4"/><text x="${x}" y="${y + 12}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="38" fill="${txt(k, i)}">${k}</text>`).join("")}
    <circle cx="100" cy="100" r="30" fill="#232323"/><text x="100" y="107" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="${concluido ? 18 : 20}" fill="#FDB913">${concluido ? "OK" : atual || "—"}</text></svg>`;
}
function legendaPDCA(atual, concluido) {
  const ordem = ["P", "D", "C", "A"]; const ia = ordem.indexOf(atual);
  return `<div class="pdca-leg">${ordem.map((k, i) => `<div class="${concluido || (ia > -1 && i < ia) ? "feito" : k === atual ? "agora" : ""}"><b>${k}</b><span><strong>${C.pdca[k].nome}</strong>${C.pdca[k].texto}</span></div>`).join("")}</div>`;
}

    ${S.db.log.length ? `<div class="tabela-wrap"><table><thead><tr><th>Quando</th><th>Quem</th><th>O quê</th></tr></thead><tbody>

    { ativo: "painel", sub: "Plano → execução → checagem → ação: acompanhe cada estagiário por módulo e decida o próximo passo." });
}

function telaEstagiario(eid) {
  const e = est(eid); if (!e) return shell("Estagiário não encontrado", `<a class="btn" href="#/painel">Voltar ao painel</a>`, { ativo: "painel" });
  const ind = indicadores(eid);
  const linhas = C.fases.map(f => `<tr class="fase-sep"><td colspan="8">Fase ${f.n} · ${esc(f.nome)} <span class="peq" style="text-transform:none;font-family:Barlow">(${f.semanas})</span></td></tr>` +
    MODS.filter(m => m.fase === f.n).map(m => {
      const s = situacao(eid, m.id); const p = s.p; const tent = p?.tentativas || [];
      const notas = tent.filter(t => t.status === "avaliada").map(t => `<a href="#/tentativa/${eid}/${m.id}/${t.id}" style="color:${t.aprovado ? "var(--ok)" : "var(--ver)"};font-weight:600">${nota1(t.nota)}</a>`).join(" · ");
      const pendT = tent.find(t => t.status === "pendente");
      return `<tr><td><b>${m.id}</b></td><td><a href="#/modulo/${m.id}/${eid}">${esc(m.titulo)}</a><div class="peq sub">${esc(m.processo)}</div></td>
        <td>${chip(s.st)}${pendT ? `<br><a class="btn mini" style="margin-top:6px" href="#/avaliar/${eid}/${m.id}/${pendT.id}">Avaliar</a>` : ""}</td>
        <td>${fmt(p?.inicio)}</td><td>${p?.prazo ? fmt(p.prazo) : `${s.aj.dias} d.u.`}</td>
        <td>${notas || "—"}<div class="peq sub">mín. ${nota1(s.aj.notaMin)}</div></td>
        <td>${esc(p?.dominioValidado || p?.dominio || "—")}${p?.dominioValidado ? `<div class="peq sub">validado</div>` : p?.dominio ? `<div class="peq sub">autoavaliação</div>` : ""}</td>
        <td><button class="btn linha mini" data-acao="abrir-ajuste" data-mod="${m.id}">Ajustar</button></td></tr>
        <tr id="aj-${m.id}" hidden><td colspan="8" style="background:var(--nev)">${formAjuste(eid, m, s)}</td></tr>`;
    }).join("")).join("");
  const encs = S.db.encontros.filter(x => x.estId === eid).slice(0, 4);
  return shell(e.nome, `
    <div class="grade g4">
      <div class="num"><div class="v">${ind.aprov}/${ind.total}</div><div class="l">Módulos conforme o esperado</div></div>
      <div class="num"><div class="v">${ind.media != null ? nota1(ind.media) : "—"}</div><div class="l">Média na 1ª tentativa</div></div>
      <div class="num"><div class="v">${ind.assert != null ? Math.round(ind.assert) + "%" : "—"}</div><div class="l">Assertividade do tempo (planejado ÷ real)</div></div>
      <div class="num"><div class="v">${ind.reprov}</div><div class="l">Reciclagens (correções)</div></div></div>
    <div class="painel cinza" style="margin-top:20px"><b>Recálculo do plano.</b> Término planejado em ${fmt(ind.fimPlanejado)}; no ritmo atual, ${ind.previsao ? `previsão de término em <b>${fmt(ind.previsao)}</b>` : "<b>trilha concluída</b>"}.
      ${ind.gatilhos.length ? `<div class="aviso" style="margin-bottom:0">${ind.gatilhos.map(g => esc(g.txt)).join("<br>")}</div>` : ""}</div>
    <h2>Módulos</h2>
    <div class="tabela-wrap"><table><thead><tr><th>Nº</th><th>Módulo</th><th>Situação</th><th>Início</th><th>Teste libera</th><th>Notas</th><th>Domínio</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>
    <h2>Matriz processo × domínio</h2>
    <div class="tabela-wrap"><table><thead><tr><th>Módulo</th>${C.niveis.map(n => `<th>${n}</th>`).join("")}</tr></thead><tbody>
      ${MODS.map(m => { const p = prog(eid, m.id); const d = p?.dominioValidado || p?.dominio; const i = C.niveis.indexOf(d);
        return `<tr><td>${m.id} · ${esc(m.titulo)}</td>${C.niveis.map((n, k) => `<td style="text-align:center">${i >= k ? `<span aria-label="sim" style="display:inline-block;width:16px;height:16px;background:${p?.dominioValidado ? "var(--gra)" : "var(--am)"}"></span>` : ""}</td>`).join("")}</tr>`; }).join("")}</tbody></table></div>
    <p class="ajuda">Quadrado escuro: nível validado pela instrutora. Amarelo: autoavaliação do estagiário.</p>
    <h2>Últimas conversas semanais</h2>
    ${encs.length ? encs.map(x => `<div class="painel"><b>${fmt(x.data)}</b>${x.gatilho && x.gatilho !== "Nenhum" ? ` · <span class="st st-reciclagem">${esc(x.gatilho)}</span>` : ""}<p style="margin-top:6px;white-space:pre-wrap">${esc(x.revisao)}</p>${x.prioridades ? `<p class="peq"><b>Próxima semana:</b> ${esc(x.prioridades)}</p>` : ""}</div>`).join("") : `<div class="vazio">Nenhuma conversa registrada. <a href="#/encontros">Registrar conversa</a></div>`}
    <h2>Cadastro</h2>
    <div class="painel"><div class="linha-form">
      <div><label for="e-nome">Nome</label><input id="e-nome" type="text" value="${esc(e.nome)}"></div>
      <div><label for="e-inicio">Início da imersão</label><input id="e-inicio" type="date" value="${esc(e.inicio)}"></div>
      <div><label for="e-pin">Novo PIN (deixe vazio para manter)</label><input id="e-pin" type="text" inputmode="numeric"></div></div>
      <div class="acoes"><button class="btn escuro" data-acao="salvar-estagiario" data-est="${eid}">Salvar cadastro</button>
      <button class="btn perigo" data-acao="arquivar-estagiario" data-est="${eid}">Arquivar estagiário</button></div></div>`,
    { volta: ["#/painel", "Painel"], ativo: "painel", sub: `Início em ${fmt(e.inicio)}. Ajuste prazos, notas mínimas e escopo por módulo: o ajuste é por processo, não do plano inteiro.` });
}
function formAjuste(eid, m, s) {
  const p = s.p; const aberto = p && (p.status === "estudo" || p.status === "reciclagem");
  return `<div class="linha-form">
    <div><label for="aj-d-${m.id}">Prazo de estudo (dias úteis)</label><input id="aj-d-${m.id}" type="number" min="1" max="60" value="${s.aj.dias}"></div>
    <div><label for="aj-n-${m.id}">Nota mínima (0–10)</label><input id="aj-n-${m.id}" type="number" min="0" max="10" step="0.5" value="${s.aj.notaMin}"></div>
    <div><label for="aj-e-${m.id}">Escopo</label><select id="aj-e-${m.id}"><option value="1" ${s.aj.escopo ? "selected" : ""}>Faz parte do escopo</option><option value="0" ${s.aj.escopo ? "" : "selected"}>Fora do escopo (dispensar)</option></select></div>
    ${aberto ? `<div><label for="aj-p-${m.id}">Data de liberação do teste</label><input id="aj-p-${m.id}" type="date" value="${p.prazo}"></div>` : ""}</div>
    <div class="acoes"><button class="btn escuro mini" data-acao="salvar-ajuste" data-est="${eid}" data-mod="${m.id}">Salvar ajuste</button>
    ${aberto && !p.liberado && hoje() < p.prazo ? `<button class="btn mini" data-acao="liberar-teste" data-est="${eid}" data-mod="${m.id}">Liberar teste agora</button>` : ""}
    ${p && p.status !== "estudo" && p.status !== "reciclagem" && p.status !== "avaliacao" ? `<button class="btn linha mini" data-acao="reabrir" data-est="${eid}" data-mod="${m.id}">Reabrir módulo para reciclagem</button>` : ""}</div>`;
}

function telaAvaliacoes() {
  const pend = pendentesAvaliacao();
  const feitas = [];
  for (const e of S.db.estagiarios) for (const m of MODS) for (const t of (prog(e.id, m.id)?.tentativas || [])) if (t.status === "avaliada") feitas.push({ e, m, t });
  feitas.sort((a, b) => b.t.avaliadoEm.localeCompare(a.t.avaliadoEm));
  return shell("Avaliações", `
    <h2>Aguardando você</h2>
    ${pend.length ? `<div class="tabela-wrap"><table><thead><tr><th>Enviado</th><th>Estagiário</th><th>Módulo</th><th>Tentativa</th><th>Parcial automática</th><th></th></tr></thead><tbody>
      ${pend.map(({ e, m, t }) => `<tr><td>${fmtHora(t.enviadoEm)}</td><td>${esc(e.nome)}</td><td>${m.id} · ${esc(m.titulo)}</td><td>${t.n}ª</td><td>${t.questoes.filter(q => q.tipo === "mc").length ? nota1(calcNota(t)) + " (só objetivas)" : "—"}</td><td><a class="btn mini" href="#/avaliar/${e.id}/${m.id}/${t.id}">Avaliar</a></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="vazio">Nenhum teste pendente. Quando um estagiário enviar um teste, ele aparece aqui.</div>`}
    <h2>Já avaliadas</h2>
    ${feitas.length ? `<div class="tabela-wrap"><table><thead><tr><th>Avaliado</th><th>Estagiário</th><th>Módulo</th><th>Nota</th><th>Resultado</th></tr></thead><tbody>
      ${feitas.slice(0, 40).map(({ e, m, t }) => `<tr><td>${fmtHora(t.avaliadoEm)}</td><td>${esc(e.nome)}</td><td><a href="#/tentativa/${e.id}/${m.id}/${t.id}">${m.id} · ${esc(m.titulo)}</a> (${t.n}ª)</td><td><b>${nota1(t.nota)}</b></td><td>${t.aprovado ? chip("aprovado") : chip("reciclagem")}</td></tr>`).join("")}</tbody></table></div>` : `<div class="vazio">Sem histórico ainda.</div>`}`,
    { ativo: "avaliacoes", sub: "Questões objetivas já chegam corrigidas. Você pontua as dissertativas e práticas e escreve o feedback." });
}

function telaAvaliar(eid, mid, tid) {
  const e = est(eid), m = modPorId(mid), p = prog(eid, mid), t = p?.tentativas?.find(x => x.id === tid);
  if (!e || !m || !t) return shell("Tentativa não encontrada", `<a class="btn" href="#/avaliacoes">Voltar</a>`, { ativo: "avaliacoes" });
  if (t.status !== "pendente") return telaTentativa(eid, mid, tid);
  const aj = ajuste(eid, mid);
  const qs = t.questoes.map((q, i) => {
    const r = t.respostas[q.id];
    let bloco = "";
    if (q.tipo === "mc") {
      bloco = q.opcoes.map((o, k) => `<div class="opcao ${k === q.correta ? "certa" : k === Number(r) ? "errada" : ""}" style="cursor:default"><span>${k === Number(r) ? "●" : "○"}</span><span>${esc(o)}${k === q.correta ? " <b>(correta)</b>" : ""}</span></div>`).join("") +
        `<div class="notaq"><span>Nota automática: <b>${t.notas[q.id]?.nota ?? 0} de ${q.peso}</b></span></div>`;
    } else {
      bloco = `<div class="resposta">${esc(r?.texto || "(sem resposta)")}</div>${r?.link ? `<p class="peq">Evidência: <a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.link)}</a></p>` : ""}
        <div class="gabarito"><b>O que se espera</b>${esc(q.esperado || "—")}</div>
        <div class="notaq"><label for="nq-${q.id}" style="margin:0">Nota (0 a ${q.peso})</label><input id="nq-${q.id}" type="number" min="0" max="${q.peso}" step="0.5" data-nota="${q.id}" data-peso="${q.peso}" required></div>`;
    }
    return `<div class="questao"><div class="qh"><span class="qn">Questão ${i + 1}</span><span class="qt">${{ mc: "Objetiva", aberta: "Dissertativa", pratica: "Prática" }[q.tipo]} · peso ${q.peso}</span></div>
      <div class="enun">${esc(q.enunciado)}</div>${bloco}
      <label for="cq-${q.id}">Comentário para o estagiário (opcional)</label><textarea id="cq-${q.id}" data-coment="${q.id}" style="min-height:60px"></textarea></div>`;
  }).join("");
  return shell(`Avaliar ${m.id}`, `
    <div class="faixa">${esc(e.nome)} · ${esc(m.titulo)} · ${t.n}ª tentativa enviada em ${fmtHora(t.enviadoEm)}. Nota mínima para avançar: ${nota1(aj.notaMin)}.</div>
    ${p.dominio ? `<p><b>Autoavaliação de domínio:</b> ${esc(p.dominio)}</p>` : ""}
    ${p.anotacoes ? `<details class="acc"><summary>Anotações do estagiário no módulo</summary><div class="corpo" style="white-space:pre-wrap">${esc(p.anotacoes)}</div></details>` : ""}
    ${qs}
    <div class="resultado" id="res-prev"><div class="nota" id="nota-prev">—</div><div><div class="rot" id="rot-prev">Preencha as notas</div><div class="peq">Calculada sobre o peso total das questões</div></div></div>
    <div class="painel">
      <label for="av-dom">Nível de domínio validado</label>
      <select id="av-dom">${C.niveis.map(n => `<option ${n === p.dominio ? "selected" : ""}>${n}</option>`).join("")}</select>
      <label for="av-fb">Feedback geral</label><textarea id="av-fb" placeholder="O que foi bem, o que precisa melhorar e como estudar para a próxima etapa."></textarea>
      <div id="av-recic" hidden><label for="av-dias">Dias úteis de reciclagem antes do novo teste</label><input id="av-dias" type="number" min="1" max="30" value="3" style="max-width:140px">
        <p class="ajuda">Abaixo da nota mínima, o módulo volta para estudo (Agir no PDCA) e o teste reabre depois desse prazo.</p></div>
      <div class="acoes"><button class="btn" data-acao="enviar-avaliacao" data-est="${eid}" data-mod="${mid}" data-tent="${tid}" data-min="${aj.notaMin}">Enviar avaliação</button></div></div>`,
    { volta: ["#/avaliacoes", "Avaliações"], ativo: "avaliacoes" });
}

function telaEncontros() {
  const ests = S.db.estagiarios.filter(e => e.ativo !== false);
  return shell("Conversas semanais", `
    <div class="faixa">30 minutos por semana: dúvidas, revisão do que foi executado e prioridades da semana seguinte.</div>
    ${ests.length ? `<div class="painel"><div class="linha-form">
      <div><label for="en-est">Estagiário</label><select id="en-est">${ests.map(e => `<option value="${e.id}">${esc(e.nome)}</option>`).join("")}</select></div>
      <div><label for="en-data">Data</label><input id="en-data" type="date" value="${hoje()}"></div>
      <div><label for="en-gat">Gatilho</label><select id="en-gat"><option>Nenhum</option><option>Ajuste — estender a fase</option><option>Ajuste — reduzir nº de sites</option><option>Ajuste — voltar processo ao modo acompanhado</option><option>Aceleração — antecipar fase</option><option>Aceleração — ampliar sites</option></select></div></div>
      <label for="en-rev">Dúvidas e revisão do que foi executado</label><textarea id="en-rev"></textarea>
      <label for="en-pri">Prioridades da próxima semana</label><input id="en-pri" type="text">
      <div class="acoes"><button class="btn" data-acao="salvar-encontro">Registrar conversa</button></div></div>` : `<div class="vazio">Cadastre um estagiário no Painel para registrar conversas.</div>`}
    <h2>Histórico</h2>
    ${S.db.encontros.length ? S.db.encontros.map(x => `<div class="painel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>${esc(est(x.estId)?.nome || "—")} · ${fmt(x.data)}</b>${x.gatilho !== "Nenhum" ? `<span class="st st-reciclagem">${esc(x.gatilho)}</span>` : ""}</div>
      <p style="white-space:pre-wrap;margin-top:6px">${esc(x.revisao)}</p>${x.prioridades ? `<p class="peq"><b>Próxima semana:</b> ${esc(x.prioridades)}</p>` : ""}
      <button class="btn linha mini" data-acao="apagar-encontro" data-id="${x.id}">Apagar</button></div>`).join("") : `<div class="vazio">Nenhuma conversa registrada.</div>`}`,
    { ativo: "encontros", sub: "Registro do acompanhamento contínuo e dos gatilhos de ajuste ou aceleração." });
}

function telaQuestoes() {
  const blocos = C.fases.map(f => `<h2>Fase ${f.n} · ${esc(f.nome)}</h2>` + MODS.filter(m => m.fase === f.n).map(m => {
    const qs = [...m.questoes, ...(S.db.questoesExtras[m.id] || []).map(q => ({ ...q, extra: true }))];
    const ativas = qs.filter(q => !S.db.questoesOff[q.id]).length;
    return `<details class="acc"><summary><span>${m.id} · ${esc(m.titulo)}</span><span class="peq sub">${ativas} ativas</span></summary><div class="corpo">
      ${qs.map((q, i) => `<div class="questao" style="${S.db.questoesOff[q.id] ? "opacity:.5" : ""}"><div class="qh"><span class="qn">${i + 1}. ${{ mc: "Objetiva", aberta: "Dissertativa", pratica: "Prática" }[q.tipo]}${q.extra ? " · sua" : ""}</span><span class="qt">peso ${q.peso}</span></div>
        <div class="enun">${esc(q.enunciado)}</div>
        ${q.tipo === "mc" ? q.opcoes.map((o, k) => `<div class="opcao ${k === q.correta ? "certa" : ""}" style="cursor:default">${k === q.correta ? "✓" : "○"} ${esc(o)}</div>`).join("") + (q.explicacao ? `<div class="gabarito"><b>Explicação</b>${esc(q.explicacao)}</div>` : "") : `<div class="gabarito"><b>O que se espera</b>${esc(q.esperado || "—")}</div>`}
        <div class="acoes"><button class="btn linha mini" data-acao="toggle-questao" data-q="${q.id}">${S.db.questoesOff[q.id] ? "Reativar" : "Desativar"}</button>
        ${q.extra ? `<button class="btn perigo mini" data-acao="apagar-questao" data-mod="${m.id}" data-q="${q.id}">Excluir</button>` : ""}</div></div>`).join("")}
      <h3>Nova questão para ${m.id}</h3>
      <div class="linha-form"><div><label for="nq-t-${m.id}">Tipo</label><select id="nq-t-${m.id}"><option value="mc">Objetiva</option><option value="aberta">Dissertativa</option><option value="pratica">Prática</option></select></div>
        <div><label for="nq-p-${m.id}">Peso</label><input id="nq-p-${m.id}" type="number" min="1" max="10" value="1"></div></div>
      <label for="nq-e-${m.id}">Enunciado</label><textarea id="nq-e-${m.id}" style="min-height:70px"></textarea>
      <label for="nq-o-${m.id}">Alternativas (objetiva) — uma por linha, comece a correta com *</label><textarea id="nq-o-${m.id}" style="min-height:90px" placeholder="*Alternativa correta&#10;Alternativa errada&#10;Alternativa errada"></textarea>
      <label for="nq-g-${m.id}">Explicação (objetiva) ou o que se espera (dissertativa/prática)</label><textarea id="nq-g-${m.id}" style="min-height:70px"></textarea>
      <div class="acoes"><button class="btn escuro mini" data-acao="add-questao" data-mod="${m.id}">Adicionar questão</button></div></div></details>`;
  }).join("")).join("");
  return shell("Banco de questões", `<div class="faixa">Veja todas as perguntas com gabarito, desative as que não fizerem sentido e crie as suas. Mudanças valem para os próximos testes; testes já enviados guardam as questões da época.</div>${blocos}`,
    { ativo: "questoes" });
}

function telaConteudo() {
  return shell("Conteúdo da trilha", C.fases.map(f => `<h2>Fase ${f.n} · ${esc(f.nome)}</h2><p class="sub">${esc(f.semanas)} — ${esc(f.objetivo)}</p><p><b>Critério de saída:</b> ${esc(f.criterio)}</p>
    <div class="estacoes">${MODS.filter(m => m.fase === f.n).map(m => `<a class="estacao" href="#/modulo/${m.id}"><span class="cod">${m.id} · ${m.dias} dias úteis</span><span class="tit">${esc(m.titulo)}</span><span class="peq sub">${esc(m.processo)} · nota mín. ${nota1(m.notaMin)}</span></a>`).join("")}</div>`).join(""),
    { ativo: "conteudo", sub: "Tudo o que o estagiário vê em cada módulo. Para editar textos e prazos-padrão, altere o arquivo curriculo.js." });
}

/* ------------------------------ telas: estagiário ------------------------------ */
function telaTrilha() {
  const eid = S.user.id; const e = est(eid); const ind = indicadores(eid); const m = moduloAtual(eid);
  const s = m ? situacao(eid, m.id) : null;
  let proximo = "";
  if (!m) proximo = `<p>Você concluiu todos os módulos do escopo. Combine com a instrutora a avaliação final e o plano dos próximos 90 dias.</p>`;
  else if (s.st === "disponivel") proximo = `<p>Próximo módulo: <b>${esc(m.titulo)}</b>. Ao iniciar, você tem ${s.aj.dias} dias úteis de estudo e prática antes do teste.</p><div class="acoes"><a class="btn" href="#/modulo/${m.id}">Abrir módulo</a></div>`;
  else if (s.st === "estudo" || s.st === "reciclagem") proximo = `<p>${s.st === "reciclagem" ? "Reciclagem" : "Estudo"} de <b>${esc(m.titulo)}</b>. O teste libera em <b>${fmt(s.p.prazo)}</b> (${s.faltam} dia${s.faltam === 1 ? "" : "s"} úte${s.faltam === 1 ? "il" : "is"}).</p><div class="acoes"><a class="btn" href="#/modulo/${m.id}">Continuar estudando</a></div>`;
  else if (s.st === "teste") proximo = `<p>O teste de <b>${esc(m.titulo)}</b> está liberado. Nota mínima para avançar: ${nota1(s.aj.notaMin)}.</p><div class="acoes"><a class="btn" href="#/teste/${m.id}">Fazer o teste</a><a class="btn linha" href="#/modulo/${m.id}">Revisar o módulo</a></div>`;
  else if (s.st === "avaliacao") proximo = `<p>Seu teste de <b>${esc(m.titulo)}</b> foi enviado e está com a instrutora. Você recebe a nota e o feedback aqui.</p>`;
  const fases = C.fases.map(f => `<div class="fase"><div class="fn"><b>${f.n}</b>${esc(f.nome)}<div class="peq" style="text-transform:none;font-family:Barlow;font-weight:400;margin-top:4px">${esc(f.semanas)}</div></div>
    <div class="estacoes">${MODS.filter(x => x.fase === f.n).map(x => { const sx = situacao(eid, x.id);
      const cls = x === m ? "atual" : sx.st === "bloqueado" || sx.st === "dispensado" ? "bloq" : sx.st === "aprovado" ? "feito" : "";
      const inner = `<span class="cod">${x.id}</span><span class="tit">${esc(x.titulo)}</span>${chip(sx.st)}`;
      return sx.st === "bloqueado" ? `<div class="estacao ${cls}" aria-disabled="true">${inner}</div>` : `<a class="estacao ${cls}" href="#/modulo/${x.id}">${inner}</a>`; }).join("")}</div></div>`).join("");
  return shell(`Olá, ${(e.nome || "").split(" ")[0]}`, `
    <div class="pdca-wrap"><div class="pdca">${anelPDCA(m ? etapaPDCA(s.st) : "A", !m)}</div>
      <div><h2 style="margin-top:0">${m ? `${m.id} · ${esc(m.titulo)}` : "Trilha concluída"}</h2>${m ? `<p class="sub">Fase ${m.fase} · ${esc(faseDe(m.fase).nome)} — ${chip(s.st)}</p>` : ""}${proximo}</div></div>
    <div class="grade g3" style="margin-top:28px">
      <div class="num"><div class="v">${ind.aprov}/${ind.total}</div><div class="l">Módulos aprovados</div></div>
      <div class="num"><div class="v">${ind.media != null ? nota1(ind.media) : "—"}</div><div class="l">Sua média na 1ª tentativa</div></div>
      <div class="num"><div class="v">${fmt(ind.fimPlanejado)}</div><div class="l">Término planejado da imersão</div></div></div>
    <h2>Sua trilha</h2><div class="trilho">${fases}</div>`,
    { ativo: "trilha", sub: "Cada módulo é um ciclo PDCA: planeja, estuda e pratica, faz o teste, e avança ou recicla." });
}

function telaModulo(mid, eid) {
  const m = modPorId(mid); if (!m) return shell("Módulo não encontrado", "", {});
  const souEst = S.user.tipo === "estagiario";
  const s = eid ? situacao(eid, mid) : null; const p = s?.p; const f = faseDe(m.fase);
  const aj = eid ? s.aj : { dias: m.dias, notaMin: m.notaMin };
  const etapa = s ? etapaPDCA(s.st) : "";
  const podeEditar = souEst && p && (s.st === "estudo" || s.st === "reciclagem" || s.st === "teste");
  let acao = "";
  if (s) {
    if (s.st === "bloqueado") acao = `<div class="aviso">Conclua os módulos anteriores para liberar este.</div>`;
    else if (s.st === "dispensado") acao = `<div class="aviso info">Este módulo está fora do seu escopo. O conteúdo fica disponível para consulta.</div>`;
    else if (s.st === "disponivel") acao = souEst ? `<div class="painel cinza"><b>Planejar.</b> Ao iniciar, o prazo de ${aj.dias} dias úteis começa a contar hoje e o teste libera em ${fmt(addUteis(hoje(), aj.dias))}.<div class="acoes"><button class="btn" data-acao="iniciar" data-mod="${mid}">Iniciar módulo</button></div></div>` : `<div class="aviso info">Ainda não iniciado pelo estagiário.</div>`;
    else if (s.st === "estudo" || s.st === "reciclagem") acao = `<div class="painel cinza"><b>${s.st === "reciclagem" ? "Reciclagem" : "Executar"}.</b> O teste libera em ${fmt(p.prazo)} (${s.faltam} dia(s) úteis). Use o tempo para estudar o material e praticar na rotina.</div>`;
    else if (s.st === "teste") acao = `<div class="painel" style="border:2px solid var(--car);box-shadow:5px 5px 0 var(--am)"><b>Checar.</b> O teste de habilidade está liberado. Nota mínima: ${nota1(aj.notaMin)}.${souEst ? `<div class="acoes"><a class="btn" href="#/teste/${mid}">Fazer o teste</a></div>` : ""}</div>`;
    else if (s.st === "avaliacao") acao = `<div class="aviso info">Teste enviado. Aguardando a avaliação da instrutora.${!souEst ? ` <a href="#/avaliar/${eid}/${mid}/${p.tentativas.find(t => t.status === "pendente")?.id}">Avaliar agora</a>` : ""}</div>`;
    else if (s.st === "aprovado") acao = `<div class="aviso ok"><b>Agir: módulo aprovado</b> em ${fmt(p.aprovadoEm)} com nota ${nota1(p.tentativas.at(-1).nota)}.</div>`;
  }
  const hist = p?.tentativas?.length ? `<h2>Tentativas e feedback</h2>${p.tentativas.map(t => `<div class="painel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>${t.n}ª tentativa · ${fmtHora(t.enviadoEm)}</b>${t.status === "avaliada" ? `<span><b>${nota1(t.nota)}</b> ${t.aprovado ? chip("aprovado") : chip("reciclagem")}</span>` : chip("avaliacao")}</div>
    ${t.feedback ? `<div class="comentario">${esc(t.feedback)}</div>` : ""}${t.status === "avaliada" ? `<div class="acoes"><a class="btn linha mini" href="#/tentativa/${eid}/${mid}/${t.id}">Ver correção completa</a></div>` : ""}</div>`).join("")}` : "";
  const ck = p?.checklist || {};
  return shell(`${m.id} · ${m.titulo}`, `
    <div class="faixa">${esc(m.objetivo)}</div>
    <div class="plano"><div><small>Fase</small><strong>${f.n} · ${esc(f.nome)}</strong></div><div><small>Prazo de estudo</small><strong>${aj.dias} dias úteis</strong></div><div><small>Nota mínima</small><strong>${nota1(aj.notaMin)}</strong></div><div><small>Modo de prática</small><strong>${esc(m.modo)}</strong></div></div>
    ${s ? `<div class="pdca-wrap"><div class="pdca">${anelPDCA(etapa, s.st === "aprovado")}</div><div>${legendaPDCA(etapa, s.st === "aprovado")}</div></div><div style="margin-top:18px">${acao}</div>` : ""}
    <h2>Por que esta etapa importa</h2><ul class="lista">${m.porque.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <h2>O que você influencia</h2><ul class="lista">${m.influencia.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <h2>Como fazer</h2><p class="peq sub">Referência: ${esc(m.ref)} · Processo ${esc(m.processo)}</p>
    <ol class="passos">${m.passos.map(x => `<li><span>${esc(x)}</span></li>`).join("")}</ol>
    ${m.atencao.map(a => `<div class="atencao"><b>ATENÇÃO:</b> ${esc(a)}</div>`).join("")}
    ${eid ? `<h2>Seu estudo</h2>
      <div class="grade g2"><div><h3>Checklist</h3>${m.checklist.map((c, i) => `<label class="check"><input type="checkbox" data-ck="${i}" data-mod="${mid}" ${ck[i] ? "checked" : ""} ${podeEditar ? "" : "disabled"}><span>${esc(c)}</span></label>`).join("")}</div>
      <div><h3>Autoavaliação de domínio</h3>${C.niveis.map(n => `<label class="check"><input type="radio" name="dom" value="${n}" data-dom data-mod="${mid}" ${p?.dominio === n ? "checked" : ""} ${podeEditar ? "" : "disabled"}><span>${n}</span></label>`).join("")}
        ${p?.dominioValidado ? `<p class="peq">Validado pela instrutora: <b>${esc(p.dominioValidado)}</b></p>` : ""}</div></div>
      <h3>Anotações e dúvidas para a conversa semanal</h3>
      <textarea data-anot data-mod="${mid}" ${podeEditar ? "" : "disabled"} placeholder="O que ficou claro, o que ainda gera dúvida, casos reais que você acompanhou.">${esc(p?.anotacoes || "")}</textarea>
      ${podeEditar ? `<p class="ajuda">Salvo automaticamente.</p>` : ""}` : ""}
    ${hist}`,
    { volta: souEst ? ["#/trilha", "Minha trilha"] : eid ? [`#/estagiario/${eid}`, est(eid)?.nome || "Estagiário"] : ["#/conteudo", "Conteúdo da trilha"], ativo: souEst ? "trilha" : eid ? "painel" : "conteudo",
      sub: `${esc(m.processo)} · ${esc(m.ref)}` });
}

function telaTeste(mid) {
  const eid = S.user.id; const m = modPorId(mid); const s = situacao(eid, mid);
  if (s.st !== "teste") return shell("Teste indisponível", `<div class="aviso">${s.st === "estudo" || s.st === "reciclagem" ? `O teste libera em ${fmt(s.p.prazo)}.` : "Este teste não está disponível agora."}</div><a class="btn" href="#/modulo/${mid}">Voltar ao módulo</a>`, { ativo: "trilha" });
  const qs = questoesDe(mid); const rasc = JSON.parse(localStorage.getItem(K_RASC + eid + mid) || "{}");
  return shell(`Teste · ${m.id}`, `
    <div class="faixa">${esc(m.titulo)} · ${qs.length} questões · nota mínima ${nota1(s.aj.notaMin)}. As objetivas são corrigidas na hora; as dissertativas e práticas, pela instrutora. Seu rascunho fica salvo neste navegador até o envio.</div>
    ${qs.map((q, i) => `<div class="questao"><div class="qh"><span class="qn">Questão ${i + 1}</span><span class="qt">${{ mc: "Objetiva", aberta: "Dissertativa", pratica: "Prática" }[q.tipo]} · peso ${q.peso}</span></div>
      <div class="enun" id="en-${q.id}">${esc(q.enunciado)}</div>
      ${q.tipo === "mc" ? `<div role="radiogroup" aria-labelledby="en-${q.id}">${q.opcoes.map((o, k) => `<label class="opcao"><input type="radio" name="r-${q.id}" value="${k}" data-resp="${q.id}" ${String(rasc[q.id]) === String(k) ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>`
      : `<textarea data-resp="${q.id}" aria-labelledby="en-${q.id}" placeholder="${q.tipo === "pratica" ? "Descreva o que você fez, os dados e o resultado." : "Responda com suas palavras."}">${esc(rasc[q.id]?.texto || "")}</textarea>
        ${q.tipo === "pratica" ? `<label for="lk-${q.id}">Link da evidência (opcional: SharePoint, OneDrive, e-mail)</label><input id="lk-${q.id}" type="url" data-link="${q.id}" value="${esc(rasc[q.id]?.link || "")}">` : ""}`}</div>`).join("")}
    <div class="acoes"><button class="btn" data-acao="enviar-teste" data-mod="${mid}">Enviar teste para avaliação</button><a class="btn linha" href="#/modulo/${mid}">Voltar ao módulo</a></div>`,
    { volta: [`#/modulo/${mid}`, m.titulo], ativo: "trilha" });
}

function telaTentativa(eid, mid, tid) {
  const m = modPorId(mid), p = prog(eid, mid), t = p?.tentativas?.find(x => x.id === tid);
  if (!t) return shell("Tentativa não encontrada", "", {});
  const aval = t.status === "avaliada";
  const souEst = S.user.tipo === "estagiario";
  const qs = t.questoes.map((q, i) => {
    const r = t.respostas[q.id]; const n = t.notas?.[q.id];
    let bloco = q.tipo === "mc"
      ? q.opcoes.map((o, k) => `<div class="opcao ${aval && k === q.correta ? "certa" : aval && k === Number(r) ? "errada" : ""}" style="cursor:default"><span>${k === Number(r) ? "●" : "○"}</span><span>${esc(o)}</span></div>`).join("") + (aval && q.explicacao ? `<div class="gabarito"><b>Explicação</b>${esc(q.explicacao)}</div>` : "")
      : `<div class="resposta">${esc(r?.texto || "(sem resposta)")}</div>${r?.link ? `<p class="peq">Evidência: <a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.link)}</a></p>` : ""}${aval ? `<div class="gabarito"><b>O que se esperava</b>${esc(q.esperado || "—")}</div>` : ""}`;
    return `<div class="questao"><div class="qh"><span class="qn">Questão ${i + 1}</span><span class="qt">${aval ? `<b>${n?.nota ?? 0} de ${q.peso}</b>` : `peso ${q.peso}`}</span></div><div class="enun">${esc(q.enunciado)}</div>${bloco}${n?.coment ? `<div class="comentario"><b>Instrutora:</b> ${esc(n.coment)}</div>` : ""}</div>`;
  }).join("");
  return shell(`${m.id} · ${t.n}ª tentativa`, `
    ${aval ? `<div class="resultado"><div class="nota">${nota1(t.nota)}</div><div><div class="rot">${t.aprovado ? "Aprovado — próximo módulo liberado" : "Reciclagem — novo teste em " + fmt(t.novoPrazo)}</div><div class="peq">Nota mínima ${nota1(t.notaMin)} · avaliado em ${fmtHora(t.avaliadoEm)} · domínio validado: ${esc(t.dominio || "—")}</div></div></div>
      ${t.feedback ? `<h2>Feedback da instrutora</h2><div class="comentario" style="font-size:16px;white-space:pre-wrap">${esc(t.feedback)}</div>` : ""}`
      : `<div class="aviso info">Aguardando avaliação da instrutora.</div>`}
    <h2>Questões</h2>${qs}`,
    { volta: souEst ? [`#/modulo/${mid}`, m.titulo] : [`#/estagiario/${eid}`, est(eid)?.nome || ""], ativo: souEst ? "trilha" : "avaliacoes" });
}

function telaResultados() {
  const eid = S.user.id; const linhas = [];
  for (const m of MODS) for (const t of (prog(eid, m.id)?.tentativas || [])) linhas.push({ m, t });
  return shell("Meus resultados", linhas.length ? `<div class="tabela-wrap"><table><thead><tr><th>Módulo</th><th>Tentativa</th><th>Enviado</th><th>Nota</th><th>Resultado</th><th></th></tr></thead><tbody>
    ${linhas.map(({ m, t }) => `<tr><td>${m.id} · ${esc(m.titulo)}</td><td>${t.n}ª</td><td>${fmtHora(t.enviadoEm)}</td><td><b>${t.status === "avaliada" ? nota1(t.nota) : "—"}</b></td><td>${t.status === "avaliada" ? (t.aprovado ? chip("aprovado") : chip("reciclagem")) : chip("avaliacao")}</td><td><a class="btn linha mini" href="#/tentativa/${eid}/${m.id}/${t.id}">Ver</a></td></tr>`).join("")}</tbody></table></div>`
    : `<div class="vazio">Você ainda não fez nenhum teste. Eles aparecem aqui com nota e feedback.</div>`, { ativo: "resultados" });
}

/* ------------------------------ eventos ------------------------------ */
function val(id) { return ($("#" + id)?.value ?? "").trim(); }
function ligar() {
  $$("[data-acao]").forEach(el => {
    const ev = el.tagName === "INPUT" && el.type === "file" ? "change" : "click";
    el.addEventListener(ev, e => { if (el.tagName === "A") e.preventDefault(); acoes[el.dataset.acao]?.(el, e); });
  });
  $$(".perfil").forEach(b => b.addEventListener("click", () => {
    $$(".perfil").forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true");
    $("#login-est").hidden = b.dataset.perfil !== "estagiario"; $("#login-pin").hidden = false; $("#l-pin").focus();
  }));
  $("#l-pin")?.addEventListener("keydown", e => { if (e.key === "Enter") acoes.entrar(); });
  // estudo do estagiário: checklist, domínio, anotações (gravação agrupada)
  $$("[data-ck]").forEach(el => el.addEventListener("change", () => { const mid = el.dataset.mod, i = el.dataset.ck, v = el.checked; const eid = S.user.id;
    agendar(db => { const p = db.progresso[eid]?.[mid]; if (p) { p.checklist = p.checklist || {}; p.checklist[i] = v; } }, `checklist ${mid}`); }));
  $$("[data-dom]").forEach(el => el.addEventListener("change", () => { const mid = el.dataset.mod, v = el.value, eid = S.user.id;
    agendar(db => { const p = db.progresso[eid]?.[mid]; if (p) p.dominio = v; }, `autoavaliação ${mid}: ${v}`); }));
  $$("[data-anot]").forEach(el => el.addEventListener("input", () => { const mid = el.dataset.mod, v = el.value, eid = S.user.id;
    agendar(db => { const p = db.progresso[eid]?.[mid]; if (p) p.anotacoes = v; }, `anotações ${mid}`); }));
  // rascunho do teste
  const salvaRasc = () => { const mid = rota()[1]; if (!mid || rota()[0] !== "teste") return; const r = coletarRespostas(); localStorage.setItem(K_RASC + S.user.id + mid, JSON.stringify(r)); };
  $$("[data-resp],[data-link]").forEach(el => el.addEventListener(el.type === "radio" ? "change" : "input", salvaRasc));
  // pré-visualização da nota na avaliação
  const prev = () => {
    const bt = $("[data-acao=enviar-avaliacao]"); if (!bt) return;
    const t = tentativaDoBotao(bt); let tot = 0, ob = 0, falta = false;
    for (const q of t.questoes) { tot += q.peso; if (q.tipo === "mc") ob += t.notas[q.id]?.nota ?? 0; else { const v = $(`[data-nota="${q.id}"]`).value; if (v === "") falta = true; else ob += Math.min(q.peso, Math.max(0, Number(v))); } }
    const n = tot ? ob / tot * 10 : 0; const min = Number(bt.dataset.min);
    $("#nota-prev").textContent = falta ? "—" : nota1(n);
    $("#rot-prev").textContent = falta ? "Preencha as notas das questões dissertativas e práticas" : n >= min ? "Aprovado — libera o próximo módulo" : "Abaixo da nota mínima — reciclagem";
    $("#av-recic").hidden = falta || n >= min;
  };
  $$("[data-nota]").forEach(el => el.addEventListener("input", prev)); prev();
}
function coletarRespostas() {
  const r = {};
  $$("[data-resp]").forEach(el => { const q = el.dataset.resp; if (el.type === "radio") { if (el.checked) r[q] = Number(el.value); } else { r[q] = { texto: el.value, link: $(`[data-link="${q}"]`)?.value || "" }; } });
  return r;
}
function tentativaDoBotao(bt) { return prog(bt.dataset.est, bt.dataset.mod).tentativas.find(t => t.id === bt.dataset.tent); }

const acoes = {
  "recarregar": () => location.reload(),
  "limpar-erro": () => { S.erroCarga = null; if (!S.db) S.db = migrar(novoDB()); ir("/config"); },
  "usar-local": () => { const c = Store.cfg(); c.modo = "local"; Store.salvarCfg(c); location.reload(); },
  async "criar-instrutor"() {
    const nome = val("i-nome"), pin = val("i-pin"), pin2 = val("i-pin2");
    if (!nome) return toast("Informe seu nome.", true);
    if (!/^\d{4,8}$/.test(pin)) return toast("O PIN precisa ter de 4 a 8 dígitos.", true);
    if (pin !== pin2) return toast("Os PINs não conferem.", true);
    const h = await hashPin("instrutor", pin);
    S.user = { tipo: "instrutor", id: "instrutor" };
    const ok = await salvar(db => { db.instrutor = { nome, pinHash: h }; }, "perfil de instrutora criado");
    if (ok) { sessionStorage.setItem(K_SES, JSON.stringify(S.user)); ir("/painel"); } else S.user = null;
  },
  async entrar() {
    const perfil = $(".perfil[aria-pressed=true]")?.dataset.perfil; const pin = val("l-pin");
    if (!perfil) return toast("Escolha o perfil.", true);
    try { await Store.carregar(); } catch (e) { return toast(e.message, true); }
    if (perfil === "instrutor") {
      if (await hashPin("instrutor", pin) !== S.db.instrutor.pinHash) return toast("PIN incorreto.", true);
      S.user = { tipo: "instrutor", id: "instrutor" };
    } else {
      const id = val("l-est"); const e = est(id); if (!e) return toast("Selecione seu nome.", true);
      if (await hashPin(id, pin) !== e.pinHash) return toast("PIN incorreto.", true);
      S.user = { tipo: "estagiario", id };
    }
    sessionStorage.setItem(K_SES, JSON.stringify(S.user)); ir(perfil === "instrutor" ? "/painel" : "/trilha");
  },
  async "criar-estagiario"() {
    const nome = val("n-nome"), email = val("n-email"), inicio = val("n-inicio") || hoje(), pin = val("n-pin");
    if (!nome) return toast("Informe o nome.", true);
    if (!/^\d{4,8}$/.test(pin)) return toast("O PIN precisa ter de 4 a 8 dígitos.", true);
    const id = "e" + uid(); const h = await hashPin(id, pin);
    salvar(db => { db.estagiarios.push({ id, nome, email, inicio, pinHash: h, ativo: true, criadoEm: new Date().toISOString() }); db.progresso[id] = {}; }, `estagiário cadastrado: ${nome}`, `${nome} cadastrado. Passe o PIN pessoalmente.`);
  },
  async "salvar-estagiario"(el) {
    const id = el.dataset.est, nome = val("e-nome"), inicio = val("e-inicio"), pin = val("e-pin");
    if (pin && !/^\d{4,8}$/.test(pin)) return toast("O PIN precisa ter de 4 a 8 dígitos.", true);
    const h = pin ? await hashPin(id, pin) : null;
    salvar(db => { const e = db.estagiarios.find(x => x.id === id); if (!e) return; if (nome) e.nome = nome; if (inicio) e.inicio = inicio; if (h) e.pinHash = h; }, `cadastro atualizado: ${nome}`, "Cadastro salvo.");
  },
  "arquivar-estagiario"(el) {
    if (!confirm("Arquivar este estagiário? Ele some do painel e do login, mas o histórico continua na base.")) return;
    const id = el.dataset.est; salvar(db => { const e = db.estagiarios.find(x => x.id === id); if (e) e.ativo = false; }, "estagiário arquivado", "Estagiário arquivado.").then(() => ir("/painel"));
  },
  "abrir-ajuste"(el) { const r = $("#aj-" + el.dataset.mod); r.hidden = !r.hidden; },
  "salvar-ajuste"(el) {
    const eid = el.dataset.est, mid = el.dataset.mod;
    const dias = Number(val("aj-d-" + mid)), notaMin = Number(val("aj-n-" + mid)), escopo = val("aj-e-" + mid) === "1", prazo = $("#aj-p-" + mid)?.value;
    if (!(dias >= 1) || !(notaMin >= 0 && notaMin <= 10)) return toast("Confira prazo e nota mínima.", true);
    salvar(db => {
      db.ajustes[eid] = db.ajustes[eid] || {}; db.ajustes[eid][mid] = { dias, notaMin, escopo };
      const p = db.progresso[eid]?.[mid]; if (p && prazo && (p.status === "estudo" || p.status === "reciclagem")) p.prazo = prazo;
    }, `ajuste ${mid}: ${dias} d.u., nota mín. ${notaMin}${escopo ? "" : ", fora do escopo"}`, "Ajuste salvo.");
  },
  "liberar-teste"(el) { const { est: eid, mod: mid } = el.dataset; salvar(db => { const p = db.progresso[eid]?.[mid]; if (p) p.liberado = true; }, `teste ${mid} liberado antes do prazo`, "Teste liberado."); },
  "reabrir"(el) {
    const { est: eid, mod: mid } = el.dataset; if (!confirm("Reabrir o módulo para reciclagem? O estagiário terá de refazer o teste.")) return;
    const dias = ajuste(eid, mid).dias;
    salvar(db => { const p = db.progresso[eid]?.[mid]; if (p) { p.status = "reciclagem"; p.prazo = addUteis(hoje(), Math.max(2, Math.ceil(dias / 2))); p.liberado = false; delete p.aprovadoEm; } }, `módulo ${mid} reaberto para reciclagem`, "Módulo reaberto.");
  },
  iniciar(el) {
    const mid = el.dataset.mod, eid = S.user.id, aj = ajuste(eid, mid);
    if (situacao(eid, mid).st !== "disponivel") return toast("Este módulo ainda não está liberado.", true);
    const prazo = addUteis(hoje(), aj.dias);
    salvar(db => { db.progresso[eid] = db.progresso[eid] || {}; if (db.progresso[eid][mid]) return;
      db.progresso[eid][mid] = { status: "estudo", inicio: hoje(), prazo, prazoOriginal: prazo, liberado: false, checklist: {}, dominio: C.niveis[0], anotacoes: "", tentativas: [] }; }, `iniciou ${mid}`, "Módulo iniciado. Bons estudos.");
  },
  "enviar-teste"(el) {
    const mid = el.dataset.mod, eid = S.user.id; const qs = questoesDe(mid); const r = coletarRespostas();
    const falta = qs.filter(q => q.tipo === "mc" ? r[q.id] === undefined : !(r[q.id]?.texto || "").trim());
    if (falta.length) return toast(`Responda todas as questões (${falta.length} em branco).`, true);
    if (!confirm("Enviar o teste? Depois do envio não é possível alterar as respostas.")) return;
    const notas = {}; for (const q of qs) if (q.tipo === "mc") notas[q.id] = { nota: r[q.id] === q.correta ? q.peso : 0, auto: true };
    const tid = "t" + uid();
    salvar(db => { const p = db.progresso[eid]?.[mid]; if (!p || p.status === "avaliacao") return;
      p.tentativas.push({ id: tid, n: p.tentativas.length + 1, enviadoEm: new Date().toISOString(), questoes: qs, respostas: r, notas, status: "pendente" });
      p.status = "avaliacao"; }, `enviou o teste de ${mid}`, "Teste enviado para a instrutora.")
      .then(ok => { if (ok) { localStorage.removeItem(K_RASC + eid + mid); ir("/modulo/" + mid); } });
  },
  "enviar-avaliacao"(el) {
    const { est: eid, mod: mid, tent: tid } = el.dataset; const t = tentativaDoBotao(el); const min = Number(el.dataset.min);
    const notas = JSON.parse(JSON.stringify(t.notas || {}));
    for (const q of t.questoes) {
      const c = $(`[data-coment="${q.id}"]`)?.value.trim() || "";
      if (q.tipo === "mc") { notas[q.id] = { ...(notas[q.id] || { nota: 0 }), coment: c }; continue; }
      const v = $(`[data-nota="${q.id}"]`).value; if (v === "") return toast("Dê nota a todas as questões dissertativas e práticas.", true);
      notas[q.id] = { nota: Math.min(q.peso, Math.max(0, Number(v))), coment: c };
    }
    const fb = val("av-fb"); if (!fb) return toast("Escreva o feedback geral: é o que orienta o próximo passo.", true);
    const dom = val("av-dom"); const dias = Math.max(1, Number(val("av-dias")) || 3);
    const nota = calcNota({ questoes: t.questoes, notas }); const aprovado = nota >= min;
    salvar(db => {
      const p = db.progresso[eid]?.[mid]; const tt = p?.tentativas.find(x => x.id === tid); if (!tt || tt.status !== "pendente") return;
      Object.assign(tt, { notas, nota, aprovado, notaMin: min, feedback: fb, dominio: dom, status: "avaliada", avaliadoEm: new Date().toISOString() });
      p.dominioValidado = dom;
      if (aprovado) { p.status = "aprovado"; p.aprovadoEm = hoje(); }
      else { p.status = "reciclagem"; p.prazo = addUteis(hoje(), dias); p.liberado = false; tt.novoPrazo = p.prazo; }
    }, `avaliou ${mid}: ${nota1(nota)} (${aprovado ? "aprovado" : "reciclagem"})`, aprovado ? "Aprovado. O próximo módulo foi liberado." : "Reciclagem registrada com novo prazo.")
      .then(ok => ok && ir("/estagiario/" + eid));
  },
  "salvar-encontro"() {
    const estId = val("en-est"), data = val("en-data") || hoje(), gatilho = val("en-gat"), revisao = val("en-rev"), prioridades = val("en-pri");
    if (!revisao) return toast("Registre ao menos as dúvidas e a revisão.", true);
    salvar(db => { db.encontros.unshift({ id: "c" + uid(), estId, data, gatilho, revisao, prioridades }); db.encontros.sort((a, b) => b.data.localeCompare(a.data)); }, "conversa semanal registrada", "Conversa registrada.");
  },
  "apagar-encontro"(el) { if (!confirm("Apagar este registro?")) return; const id = el.dataset.id; salvar(db => { db.encontros = db.encontros.filter(x => x.id !== id); }, "conversa semanal apagada"); },
  "toggle-questao"(el) { const q = el.dataset.q; salvar(db => { if (db.questoesOff[q]) delete db.questoesOff[q]; else db.questoesOff[q] = true; }, `questão ${q} ${S.db.questoesOff[q] ? "reativada" : "desativada"}`); },
  "apagar-questao"(el) { if (!confirm("Excluir esta questão?")) return; const { mod, q } = el.dataset; salvar(db => { db.questoesExtras[mod] = (db.questoesExtras[mod] || []).filter(x => x.id !== q); }, `questão ${q} excluída`); },
  "add-questao"(el) {
    const mid = el.dataset.mod; const tipo = val("nq-t-" + mid), peso = Math.max(1, Number(val("nq-p-" + mid)) || 1), enunciado = val("nq-e-" + mid), g = val("nq-g-" + mid);
    if (!enunciado) return toast("Escreva o enunciado.", true);
    const q = { id: `${mid}x${uid()}`, tipo, peso, enunciado };
    if (tipo === "mc") {
      const linhas = val("nq-o-" + mid).split("\n").map(s => s.trim()).filter(Boolean);
      const correta = linhas.findIndex(l => l.startsWith("*"));
      if (linhas.length < 2 || correta < 0) return toast("Informe ao menos 2 alternativas e marque a correta com *.", true);
      q.opcoes = linhas.map(l => l.replace(/^\*\s*/, "")); q.correta = correta; q.explicacao = g;
    } else q.esperado = g;
    salvar(db => { db.questoesExtras[mid] = db.questoesExtras[mid] || []; db.questoesExtras[mid].push(q); }, `nova questão em ${mid}`, "Questão adicionada.");
  },
  async "salvar-config"() {
    const modo = $("input[name=modo]:checked").value;
    const c = { modo, owner: val("c-owner"), repo: val("c-repo"), branch: val("c-branch") || "main", path: val("c-path") || "data/db.json", token: val("c-token") };
    if (modo === "github" && (!c.owner || !c.repo || !c.token)) return toast("Preencha usuário, repositório e token.", true);
    Store.salvarCfg(c); toast("Configuração salva. Reconectando…"); setTimeout(() => location.reload(), 600);
  },
  async "testar-config"() {
    const c = { owner: val("c-owner"), repo: val("c-repo"), branch: val("c-branch") || "main", path: val("c-path") || "data/db.json", token: val("c-token") };
    const out = $("#c-res"); out.innerHTML = `<div class="aviso info">Testando…</div>`;
    try {
      const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`, { headers: Store.hdr(c), cache: "no-store" });
      if (!r.ok) throw new Error(r.status === 404 ? "Repositório não encontrado ou sem acesso com este token." : `GitHub respondeu ${r.status}.`);
      const j = await r.json(); const { db } = await Store.ghGet(c);
      out.innerHTML = `<div class="aviso ok">Conectado a <b>${esc(j.full_name)}</b> (${j.private ? "privado" : "público"}). ${db ? `Base encontrada com ${db.estagiarios?.length || 0} estagiário(s).` : "A base ainda não existe: ela será criada na primeira gravação."}${j.permissions && !j.permissions.push ? "<br><b>Atenção:</b> o token parece não ter permissão de escrita." : ""}</div>`;
    } catch (e) { out.innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; }
  },
  exportar() {
    const blob = new Blob([JSON.stringify(S.db, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `trilha-gfc-base-${hoje()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  importar(el) {
    const f = el.files?.[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { let novo; try { novo = migrar(JSON.parse(rd.result)); if (!Array.isArray(novo.estagiarios)) throw 0; } catch { return toast("Arquivo inválido: não parece uma base da Trilha GFC.", true); }
      if (!confirm("Substituir a base atual por este arquivo?")) return;
      salvar(db => { Object.keys(db).forEach(k => delete db[k]); Object.assign(db, novo); }, "base importada de arquivo", "Base importada."); };
    rd.readAsText(f);
  },
  async "salvar-perfil"() {
    const nome = val("p-nome"), pin = val("p-pin");
    if (pin && !/^\d{4,8}$/.test(pin)) return toast("O PIN precisa ter de 4 a 8 dígitos.", true);
    const h = pin ? await hashPin("instrutor", pin) : null;
    salvar(db => { if (nome) db.instrutor.nome = nome; if (h) db.instrutor.pinHash = h; }, "perfil da instrutora atualizado", "Perfil salvo.");
  }
};

/* ------------------------------ início ------------------------------ */
window.addEventListener("hashchange", render);
window.addEventListener("beforeunload", e => { if (fila.length) { e.preventDefault(); e.returnValue = ""; } });
(async function iniciar() {
  try { S.user = JSON.parse(sessionStorage.getItem(K_SES) || "null"); } catch { S.user = null; }
  try { await Store.carregar(); }
  catch (e) { console.error(e); S.erroCarga = e.message || String(e); }
  if (S.user && S.user.tipo === "estagiario" && !est(S.user.id)) S.user = null;
  render();
})();
</script>
</body>
</html>
