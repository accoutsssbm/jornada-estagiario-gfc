<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha GFC — Sotreq</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FDB913'/><text x='50' y='68' font-size='52' text-anchor='middle' font-family='Arial' font-weight='700' fill='%23232323'>G</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --am:#FDB913; --am-esc:#E3A400; --am-cl:#FFF4D1;
  --gra:#3C3C3C; --car:#232323; --bra:#FFFFFF; --nev:#F4F4F2; --lin:#DCDCD8;
  --txt:#232323; --sub:#5C5C5C; --ver:#C8102E; --ok:#2E7D32; --lar:#C4610A; --azu:#1F5FA8;
  --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bra)}
body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--txt);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azu);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- estrutura (inspirada no Manual de Atualizações) ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--am) 236px,var(--bra) 236px)}
.rail{background:var(--am);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;box-shadow:inset -6px 0 10px -6px rgba(0,0,0,.35)}
.marca{background:var(--car);padding:18px 20px 16px;display:flex;align-items:center;gap:10px;text-decoration:none}
.marca .wm{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.3px;color:#fff;line-height:1}
.marca .wm b{color:var(--am);font-weight:700}
.marca img{max-height:34px;max-width:180px}
.quem{padding:16px 22px 10px;font-size:14px;border-bottom:1px solid rgba(0,0,0,.12)}
.quem strong{display:block;font-size:16px}
.rail nav{padding:8px 0;flex:1;overflow:auto}
.rail nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 22px;color:var(--car);font-weight:600;text-decoration:none;border-left:5px solid transparent}
.rail nav a:hover{background:rgba(0,0,0,.06)}
.rail nav a.ativo{background:rgba(0,0,0,.1);border-left-color:var(--car)}
.badge{background:var(--car);color:var(--am);border-radius:10px;padding:0 8px;font-size:13px;font-weight:700;min-width:22px;text-align:center}
.rail .pe{padding:14px 22px 18px;font-size:12.5px;color:rgba(0,0,0,.7);border-top:1px solid rgba(0,0,0,.12)}
.rail .pe .sync{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.local{background:var(--lar)} .dot.salvando{background:var(--azu)}
.main{min-width:0;display:flex;flex-direction:column}
.topo{background:var(--gra);color:#fff;padding:26px 44px 22px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28)}
.topo h1{font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:clamp(28px,4vw,42px);letter-spacing:.4px;margin:0;line-height:1.02;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.topo p{margin:6px 0 0;color:#E4E4E4;max-width:70ch}
.topo .volta{display:inline-block;color:var(--am);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:6px}
.conteudo{padding:30px 44px 72px;max-width:1140px;width:100%}
.faixa{background:var(--am);padding:14px 20px;font-style:italic;font-weight:500;margin:0 0 26px;border-left:6px solid var(--car)}

h2{font-family:var(--cond);font-weight:700;font-size:26px;text-transform:uppercase;margin:34px 0 12px;line-height:1.1}
h2:first-child{margin-top:0}
h3{font-family:var(--cond);font-weight:600;font-size:20px;margin:22px 0 8px;line-height:1.15}
.sub{color:var(--sub)}
.peq{font-size:14px}
p{margin:0 0 12px;max-width:78ch}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--am);color:var(--car);border:0;border-radius:2px;padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 2px 0 var(--am-esc)}
.btn:hover{filter:brightness(1.04)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.escuro{background:var(--gra);color:#fff;box-shadow:0 2px 0 #1a1a1a}
.btn.linha{background:transparent;box-shadow:inset 0 0 0 2px var(--gra);color:var(--gra)}
.btn.perigo{background:transparent;box-shadow:inset 0 0 0 2px var(--ver);color:var(--ver)}
.btn.mini{padding:5px 11px;font-size:14px}
.acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}

.painel{border:1px solid var(--lin);background:#fff;padding:20px 22px;margin-bottom:18px}
.painel.cinza{background:var(--nev);border-color:transparent}
.grade{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.num{border-top:4px solid var(--am);padding-top:10px}
.num .v{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1}
.num .l{font-size:14px;color:var(--sub)}

label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=url],input[type=email],select,textarea{width:100%;border:1px solid #BDBDB8;background:#fff;padding:9px 11px;border-radius:2px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gra)}
.linha-form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.ajuda{font-size:13px;color:var(--sub);margin-top:4px}

.tabela-wrap{overflow-x:auto;border:1px solid var(--lin)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{background:var(--gra);color:var(--am);text-align:left;font-weight:600;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--lin);vertical-align:top}
tr.fase-sep td{background:var(--nev);font-family:var(--cond);font-weight:700;font-size:16px;text-transform:uppercase}

.st{display:inline-block;padding:2px 9px;font-size:13px;font-weight:600;border-radius:2px;white-space:nowrap}
.st-bloqueado{background:#ECECEA;color:#7a7a7a}
.st-disponivel{background:var(--am-cl);color:#7A5600}
.st-estudo{background:#E3ECF7;color:var(--azu)}
.st-teste{background:var(--am);color:var(--car)}
.st-avaliacao{background:#F1E4F7;color:#6B2C8A}
.st-reciclagem{background:#FBE3D2;color:var(--lar)}
.st-aprovado{background:#DDF0DE;color:var(--ok)}
.st-dispensado{background:#fff;color:#8a8a8a;box-shadow:inset 0 0 0 1px #cfcfcf}

.atencao{border-top:2px solid var(--am);border-bottom:2px solid var(--am);padding:12px 8px;margin:16px 0;text-align:center;font-style:italic}
.atencao b{color:var(--ver);font-weight:700}

.passos{list-style:none;padding:0;margin:0;counter-reset:p}
.passos li{counter-increment:p;display:grid;grid-template-columns:52px 1fr;gap:6px;padding:9px 0;border-bottom:1px dashed var(--lin)}
.passos li::before{content:counter(p) "º";font-family:var(--cond);font-weight:700;font-size:30px;line-height:1;color:var(--gra)}
.lista{margin:0;padding-left:20px}
.lista li{margin-bottom:7px;max-width:78ch}

.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;font-weight:400;font-size:16px;margin:0}
.check input{width:20px;height:20px;accent-color:var(--gra);margin-top:2px;flex:none}

.barra{height:10px;background:#E6E6E2;position:relative;overflow:hidden}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--gra)}
.barra i.am{background:var(--am-esc)}

.aviso{padding:12px 16px;border-left:5px solid var(--lar);background:#FFF3E8;margin:12px 0}
.aviso.ok{border-color:var(--ok);background:#EEF7EE}
.aviso.info{border-color:var(--azu);background:#EEF3FA}
.aviso.erro{border-color:var(--ver);background:#FCEBEE}
.vazio{padding:26px;text-align:center;color:var(--sub);border:2px dashed var(--lin)}

/* ---------- trilha ---------- */
.trilho{position:relative;margin:8px 0 6px}
.fase{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:18px 0;border-top:1px solid var(--lin)}
.fase .fn{font-family:var(--cond);font-weight:700;font-size:15px;text-transform:uppercase;color:var(--sub);line-height:1.2}
.fase .fn b{display:block;font-size:44px;color:var(--gra);line-height:.95}
.estacoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.estacao{display:block;text-decoration:none;border:1px solid var(--lin);padding:12px 14px 13px;background:#fff;position:relative}
.estacao:hover{border-color:var(--gra)}
.estacao .cod{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--sub)}
.estacao .tit{font-weight:600;line-height:1.25;margin:2px 0 8px;display:block}
.estacao.atual{border:2px solid var(--car);box-shadow:5px 5px 0 var(--am)}
.estacao.bloq{opacity:.62}
.estacao.feito{background:var(--nev)}

/* ---------- PDCA ---------- */
.pdca-wrap{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:center}
.pdca svg{width:100%;height:auto;display:block}
.pdca-leg{display:grid;gap:10px}
.pdca-leg div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.pdca-leg b{font-family:var(--cond);font-size:24px;line-height:1;width:34px;height:34px;display:grid;place-items:center;background:#ECECEA;color:#8a8a8a}
.pdca-leg .feito b{background:var(--gra);color:#fff}
.pdca-leg .agora b{background:var(--am);color:var(--car)}
.pdca-leg span{font-size:14.5px}
.pdca-leg strong{display:block;font-size:15px}

.plano{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--lin);margin-bottom:24px}
.plano div{padding:12px 14px;border-left:1px solid var(--lin)}
.plano div:first-child{border-left:0}
.plano small{display:block;color:var(--sub);font-size:13px}
.plano strong{font-family:var(--cond);font-size:22px;line-height:1.1}

/* ---------- questões ---------- */
.questao{border:1px solid var(--lin);padding:18px 20px;margin-bottom:16px;background:#fff}
.questao .qh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
.questao .qn{font-family:var(--cond);font-weight:700;font-size:20px}
.questao .qt{font-size:13px;color:var(--sub);white-space:nowrap}
.questao .enun{font-weight:600;margin-bottom:12px;max-width:80ch}
.opcao{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid transparent;cursor:pointer}
.opcao:hover{background:var(--nev)}
.opcao input{margin-top:4px;accent-color:var(--gra);flex:none}
.opcao.certa{border-color:var(--ok);background:#EEF7EE}
.opcao.errada{border-color:var(--ver);background:#FCEBEE}
.resposta{background:var(--nev);padding:10px 14px;white-space:pre-wrap;border-left:4px solid var(--gra);margin:6px 0}
.gabarito{background:var(--am-cl);padding:10px 14px;border-left:4px solid var(--am-esc);margin:8px 0;font-size:14.5px}
.gabarito b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.comentario{background:#EEF3FA;border-left:4px solid var(--azu);padding:8px 14px;margin-top:8px;font-size:14.5px}
.notaq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.notaq input[type=number]{width:90px}
.resultado{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:18px 22px;background:var(--gra);color:#fff;margin:18px 0}
.resultado .nota{font-family:var(--cond);font-size:56px;font-weight:700;line-height:1;color:var(--am)}
.resultado .rot{font-family:var(--cond);font-size:22px;text-transform:uppercase;font-weight:700}

details.acc{border:1px solid var(--lin);margin-bottom:10px;background:#fff}
details.acc>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-family:var(--cond);font-size:22px;line-height:1}
details.acc[open]>summary::after{content:"–"}
details.acc>.corpo{padding:4px 16px 16px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.login .lado{background:var(--am);padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset -8px 0 14px -8px rgba(0,0,0,.35)}
.login .lado{min-width:0}
.login .lado h1{overflow-wrap:break-word;font-family:var(--cond);font-weight:700;font-size:clamp(42px,5.6vw,80px);line-height:.92;text-transform:uppercase;margin:24px 0 18px;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.login .lado p{font-weight:500;max-width:42ch}
.login .form{padding:48px 44px;display:flex;flex-direction:column;justify-content:center;max-width:560px}
.perfis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}
.perfil{border:2px solid var(--lin);background:#fff;padding:18px 16px;text-align:left;cursor:pointer}
.perfil strong{display:block;font-family:var(--cond);font-size:24px;text-transform:uppercase;line-height:1.1}
.perfil span{font-size:14px;color:var(--sub)}
.perfil[aria-pressed=true]{border-color:var(--car);box-shadow:5px 5px 0 var(--am)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--car);color:#fff;padding:12px 20px;border-left:6px solid var(--am);z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.erro{border-left-color:var(--ver)}
.carregando{min-height:100vh;display:grid;place-items:center;font-family:var(--cond);font-size:26px;text-transform:uppercase;background:var(--am)}

/* ---------- responsivo ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:var(--bra)}
  .rail{position:static;height:auto;box-shadow:none}
  .rail nav{display:flex;overflow-x:auto;padding:0}
  .rail nav a{white-space:nowrap;border-left:0;border-bottom:4px solid transparent;padding:10px 14px}
  .rail nav a.ativo{border-bottom-color:var(--car)}
  .quem,.rail .pe{display:none}
  .topo{padding:22px 20px 18px}
  .conteudo{padding:22px 20px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .fase{grid-template-columns:1fr;gap:8px}
  .fase .fn b{display:inline;font-size:30px;margin-right:6px}
  .pdca-wrap{grid-template-columns:1fr}
  .pdca{max-width:220px}
  .plano{grid-template-columns:1fr 1fr}
  .plano div:nth-child(3){border-left:0}
  .plano div:nth-child(n+3){border-top:1px solid var(--lin)}
  .login{grid-template-columns:1fr}
  .login .lado{padding:30px 22px}
  .login .form{padding:28px 22px}
}
@media (max-width:520px){.g2,.g3,.g4,.perfis{grid-template-columns:1fr}}
@media print{.rail,.acoes,.btn{display:none!important}.app{display:block}.topo{background:#fff;color:#000;box-shadow:none}.topo h1{text-shadow:none}}

/* ---------- v3: novos componentes ---------- */
.st-entrega{background:#FFF0C2;color:#7A5600;box-shadow:inset 0 0 0 1px var(--am-esc)}
.st-ajuste{background:#FBE3D2;color:var(--lar)}
.st-apresentacao{background:#E6E1F5;color:#4B3A8C}
.grafico{border:1px solid var(--lin);padding:14px 16px 10px;background:#fff;margin-bottom:18px}
.grafico h3{margin:0 0 2px}
.grafico .leg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--sub);margin:4px 0 6px}
.grafico .leg i{display:inline-block;width:14px;height:4px;vertical-align:middle;margin-right:5px}
.grafico svg{width:100%;height:auto;display:block}
.sigilo{border:2px dashed var(--gra);padding:18px 20px;margin:22px 0;background:#FAFAF8}
.sigilo .tag{display:inline-block;background:var(--car);color:var(--am);font-family:var(--cond);font-weight:700;padding:2px 10px;font-size:14px;text-transform:uppercase;margin-bottom:10px}
.arquetipo{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1.05;margin:4px 0 8px}
.medidor{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:14.5px;margin:6px 0}
.faixa-mod{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}
.faixa-mod span{width:34px;height:30px;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:13px}
.semaforo{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.semaforo i{width:12px;height:12px;border-radius:50%;display:inline-block}
.duvida{border:1px solid var(--lin);padding:14px 18px;margin-bottom:12px;background:#fff}
.duvida .meta{font-size:13px;color:var(--sub);margin-bottom:6px}
.duvida .perg{white-space:pre-wrap;font-weight:500}
.duvida .resp{background:#EEF3FA;border-left:4px solid var(--azu);padding:8px 14px;margin-top:10px;white-space:pre-wrap}
.duvida.aberta{border-left:5px solid var(--am)}
.secoes-it{counter-reset:it;list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.secoes-it li{counter-increment:it;border:1px solid var(--lin);padding:10px 12px 10px 48px;position:relative;font-size:14.5px;background:#fff}
.secoes-it li::before{content:counter(it);position:absolute;left:12px;top:8px;font-family:var(--cond);font-weight:700;font-size:26px;color:var(--gra)}
.secoes-it b{display:block}
.arquivos{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.rubrica{display:grid;grid-template-columns:1fr 110px;gap:8px 16px;align-items:center}
.rubrica small{display:block;color:var(--sub)}
.relatorio-doc{max-width:860px}
.relatorio-doc .cab{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:3px solid var(--car);padding-bottom:10px;margin-bottom:18px}
.relatorio-doc dl{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;margin:0}
.relatorio-doc dt{color:var(--sub);font-size:14px}
.relatorio-doc dd{margin:0;font-weight:500}
.texto-livre{white-space:pre-wrap;background:var(--nev);padding:10px 14px;margin:4px 0 14px}
.cap-semana{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.relatorio-doc dl{grid-template-columns:1fr}.medidor{grid-template-columns:110px 1fr 40px}.cap-semana{grid-template-columns:repeat(3,1fr)}}
@media print{.sigilo{display:none}.relatorio-doc{max-width:none}.texto-livre{background:#fff;border:1px solid #ccc}}
.st-aguardando{background:#ECECEA;color:#7a7a7a}
.st-andamento{background:#E3ECF7;color:var(--azu)}
.st-concluida{background:#DDF0DE;color:var(--ok)}
.linha-tempo{list-style:none;margin:10px 0 18px;padding:0;counter-reset:lt;position:relative}
.linha-tempo li{counter-increment:lt;position:relative;padding:4px 0 16px 52px;max-width:80ch}
.linha-tempo li::before{content:counter(lt);position:absolute;left:0;top:2px;width:34px;height:34px;border-radius:50%;background:var(--am);color:var(--car);font-family:var(--cond);font-weight:700;font-size:18px;display:grid;place-items:center}
.linha-tempo li::after{content:"";position:absolute;left:16px;top:38px;bottom:-2px;width:2px;background:var(--lin)}
.linha-tempo li:last-child::after{display:none}
.lt-t{font-weight:700}
.lt-m{font-size:13px;color:var(--sub);margin-bottom:2px}
</style>
</head>
<body>
<div id="app"><div class="carregando">Carregando a trilha…</div></div>
<script src="config.js"></script>
<script src="curriculo.js"></script>
<script>
"use strict";
/* =====================================================================
   TRILHA GFC v3 — Sotreq · Engenharia de Mineração Norte
   Controle de aprendizagem dos estagiários do GFC baseado no PDCA.
   Perfis: instrutora, estagiário e gestor (somente leitura).
   Base de dados: arquivo JSON num repositório GitHub (API de Contents).
   ===================================================================== */

const C = window.CURRICULO;
const CFG = window.GFC_CONFIG || {};

function telaEstagiario(eid) {

    return `<tr class="fase-sep"><td colspan="7">Fase ${f.n} · ${esc(f.nome)} <span style="font-family:Barlow;text-transform:none;font-weight:500;margin-left:10px">${chip(fs.st)} ${notaFase(eid, f.n) != null ? `nota da fase <b>${nota1(notaFase(eid, f.n))}</b>` : `apresentação planejada até ${fmt(plF[f.n]?.fim)}`}</span>

      return `<tr><td><b>${m.id}</b></td><td><a href="#/modulo/${m.id}/${eid}">${esc(m.titulo)}</a><div class="peq sub">${fmtH(s.aj.horasEstudo)} de estudo</div></td>

  const encs = S.db.encontros.filter(x => x.estId === eid).slice(0, 3);

function formAjuste(eid, m, s) {
  const p = s.p; const est0 = p && ["estudo", "reciclagem"].includes(p.status);
  return `<div class="linha-form"><div><label for="aj-h-${m.id}">Horas de estudo</label><input id="aj-h-${m.id}" type="number" min="0.5" max="60" step="0.5" value="${s.aj.horasEstudo}"></div>
    <div><label for="aj-n-${m.id}">Nota mínima (0–10)</label><input id="aj-n-${m.id}" type="number" min="0" max="10" step="0.5" value="${s.aj.notaMin}"></div>
    <div><label for="aj-e-${m.id}">Escopo</label><select id="aj-e-${m.id}"><option value="1" ${s.aj.escopo ? "selected" : ""}>Faz parte</option><option value="0" ${s.aj.escopo ? "" : "selected"}>Fora do escopo</option></select></div>
    ${est0 ? `<div><label for="aj-p-${m.id}">Liberação do teste</label><input id="aj-p-${m.id}" type="date" value="${p.prazo}"></div>` : ""}</div>
    <div class="acoes"><button class="btn escuro mini" data-acao="salvar-ajuste" data-est="${eid}" data-mod="${m.id}">Salvar ajuste</button>
    ${est0 && !p.liberado && hoje() < p.prazo ? `<button class="btn mini" data-acao="liberar-teste" data-est="${eid}" data-mod="${m.id}">Liberar teste agora</button>` : ""}
    ${p && p.status === "aprovado" ? `<button class="btn linha mini" data-acao="reabrir" data-est="${eid}" data-mod="${m.id}">Reabrir para reciclagem</button>` : ""}</div>`;
}

function telaIndicadores(eid) {
  const ests = ativos(); if (!ests.length) return shell("Indicadores", `<div class="vazio">Cadastre um estagiário para ver os indicadores.</div>`, { ativo: "indicadores" });
  eid = eid && est(eid) ? eid : ests[0].id; const e = est(eid); const ind = indicadores(eid);
  const feitos = MODS.filter(m => (prog(eid, m.id)?.tentativas || []).some(t => t.status === "avaliada"));
  const n1 = feitos.map(m => prog(eid, m.id).tentativas.find(t => t.status === "avaliada").nota);
  const nF = feitos.map(m => prog(eid, m.id).status === "aprovado" ? prog(eid, m.id).notaTeste : null);
  const rg = regressao(n1); const tend = rg ? n1.map((_, i) => rg.a + rg.b * i) : [];
  const leituraCurva = !rg ? "A tendência aparece a partir de 2 módulos corrigidos." : rg.b > 0.15 ? `Curva <b>ascendente</b> (+${nota1(rg.b)} ponto por módulo): o aprendizado está acelerando à medida que os processos se conectam.` : rg.b < -0.15 ? `Curva <b>descendente</b> (${nota1(rg.b)} por módulo): a complexidade crescente está pesando. Vale revisar as bases e o ritmo.` : `Curva <b>estável</b>: desempenho consistente entre módulos.`;
  const concl = MODS.filter(m => prog(eid, m.id)?.status === "aprovado" && prog(eid, m.id).inicio);
  const plD = concl.map(m => { const p = prog(eid, m.id); return uteisEntre(p.inicio, addHoras(p.inicio, ajuste(eid, m.id).horasEstudo)); });
  const reD = concl.map(m => { const p = prog(eid, m.id); return Math.max(1, uteisEntre(p.inicio, p.aprovadoEm)); });
  const fasesN = C.fases.map(f => ({ f, nt: media(escopoFase(eid, f.n).map(m => prog(eid, m.id)?.notaTeste).filter(x => x != null)), ap: faseReg(eid, f.n)?.notaIT ?? null }));
  const pf = perfil(eid); const L = pf.domE ? LEITURA[pf.domE] : null;
  const comp = ests.length > 1 ? `<h2>Comparativo entre estagiários</h2><div class="tabela-wrap"><table><thead><tr><th>Estagiário</th><th>Módulos</th><th>Fases</th><th>Média 1ª tent.</th><th>Média final</th><th>Assertividade</th><th>Situação</th></tr></thead><tbody>${ests.map(x => { const i = indicadores(x.id); return `<tr><td><a href="#/indicadores/${x.id}">${esc(x.nome)}</a></td><td>${i.aprov}/${i.total}</td><td>${i.fasesOk}/${C.fases.length}</td><td>${nota1(i.media1)}</td><td>${nota1(i.mediaFinal)}</td><td>${pct(i.assert)}</td><td>${semaforo(i)}</td></tr>`; }).join("")}</tbody></table></div>` : "";
  return shell("Indicadores", `
    ${ests.length > 1 ? `<label for="ind-est">Estagiário</label><select id="ind-est" data-acao-change="trocar-ind" style="max-width:360px">${ests.map(x => `<option value="${x.id}" ${x.id === eid ? "selected" : ""}>${esc(x.nome)}</option>`).join("")}</select>` : `<p class="sub">${esc(e.nome)}</p>`}
    <div class="grade g4" style="margin-top:18px"><div class="num"><div class="v">${ind.aprov}/${ind.total}</div><div class="l">Módulos concluídos</div></div><div class="num"><div class="v">${nota1(ind.media1)}</div><div class="l">Média na 1ª tentativa</div></div>
      <div class="num"><div class="v">${pct(ind.assert)}</div><div class="l">Assertividade do tempo</div></div><div class="num"><div class="v">${S.db.duvidas.filter(d => d.estId === eid).length}</div><div class="l">Dúvidas registradas</div></div></div>
    <h2>Curva de aprendizagem</h2>
    <div class="grafico">${feitos.length ? grafLinhas({ labels: feitos.map(m => m.id), series: [{ nome: "Teste · 1ª tentativa", v: n1 }, { nome: "Nota de aprovação", v: nF, cor: "#1F5FA8" }, { nome: "Tendência (1ª tentativa)", v: tend, cor: "#9a9a9a", dash: "4 4", semPontos: true, w: 1.5 }] }) : `<div class="vazio">A curva aparece depois do primeiro teste corrigido.</div>`}<p class="peq" style="margin-top:8px">${leituraCurva}</p></div>
    <div class="grafico"><h3>Desempenho por fase</h3>${fasesN.some(x => x.nt != null || x.ap != null) ? grafBarras({ labels: fasesN.map(x => "Fase " + x.f.n), series: [{ nome: "Média dos testes", v: fasesN.map(x => x.nt), cor: "#3C3C3C" }, { nome: "Apresentação", v: fasesN.map(x => x.ap), cor: "#E3A400" }], max: 10 }) : `<div class="vazio">Aparece com o primeiro teste corrigido.</div>`}</div>
    <h2>Evolução no tempo</h2><div class="grafico"><h3>Curva S — módulos concluídos por semana</h3>${curvaS(eid)}</div>
    <div class="grafico"><h3>Tempo por módulo (dias úteis)</h3>${concl.length ? grafBarras({ labels: concl.map(m => m.id), series: [{ nome: "Planejado", v: plD, cor: "#B8B8B2" }, { nome: "Real", v: reD, cor: "#232323" }] }) : `<div class="vazio">Aparece com o primeiro módulo concluído.</div>`}</div>
    <div class="sigilo"><span class="tag">Perfil do estagiário · visível só para você</span>
      ${pf.mods === 0 ? `<p>O perfil começa a ser montado depois do primeiro teste corrigido.</p>` : `
      <p class="peq sub">Confiabilidade da leitura: <b>${pf.conf}</b> (${pf.mods} módulo(s) com teste corrigido, ${Math.round(pf.nEnt)} sinais de estilo). Método: desempenho por eixo de competência e por nível cognitivo (taxonomia de Bloom) nas questões, estilo de aprendizagem de Honey &amp; Mumford a partir das reflexões do relatório de cada módulo e sinais de comportamento na plataforma.</p>
      ${L ? `<div class="arquetipo">${ESTILOS[pf.domE]}${pf.segE ? ` / ${ESTILOS[pf.segE]}` : ""}: ${L.t}</div><p>${L.d}</p>` : `<p><b>Estilo de aprendizagem:</b> aguardando o primeiro relatório de módulo.</p>`}
      <div class="grade g2"><div><h3>Domínio por eixo de competência</h3>${grafRadar(["Procedimental", "Conceitual", "Relacional", "Analítico"], ["P", "C", "R", "A"].map(k => pf.E[k]))}
          ${pf.forte ? `<p class="peq">Ponto forte: <b>${EIXOS[pf.forte]}</b>. A desenvolver: <b>${EIXOS[pf.fraco]}</b>.</p>` : ""}</div>
        <div><h3>Profundidade cognitiva</h3>${Object.entries(BLOOM).map(([k, n]) => medidor(n, pf.B[k])).join("")}
          <p class="peq">${pf.B.mem != null && pf.B.ana != null ? (pf.B.mem - pf.B.ana > 20 ? "Memoriza bem, mas cai quando precisa analisar ou julgar: estimule perguntas de 'e se…' e casos fora do manual." : pf.B.ana - pf.B.mem > 10 ? "Raciocina bem sobre o processo, mas esquece detalhes de regra e tela: reforce checklists e a prática." : "Desempenho equilibrado entre lembrar, aplicar e analisar.") : ""}</p>
          <h3>Estilo de aprendizagem (Honey &amp; Mumford)</h3>${Object.entries(ESTILOS).map(([k, n]) => medidor(n, pf.estPct[k], "var(--am-esc)")).join("")}</div></div>
      <h3>Sinais de comportamento</h3>
      <div class="grade g4"><div class="num"><div class="v">${pf.calib == null ? "—" : pf.calib > 1.5 ? "Superestima" : pf.calib < -1.5 ? "Subestima" : "Calibrado"}</div><div class="l">Autoconfiança × nota${pf.calib != null ? ` (${pf.calib > 0 ? "+" : ""}${nota1(pf.calib)})` : ""}</div></div>
        <div class="num"><div class="v">${pct(pf.pont == null ? null : pf.pont * 100)}</div><div class="l">Testes enviados no prazo</div></div>
        <div class="num"><div class="v">${pf.duv == null ? "—" : nota1(pf.duv)}</div><div class="l">Dúvidas por módulo</div></div>
        <div class="num"><div class="v">${pct(pf.chk == null ? null : pf.chk * 100)}</div><div class="l">Uso do checklist de estudo</div></div></div>
      ${L ? `<h3>Como conduzir com este perfil</h3><ul class="lista">${L.r.map(x => `<li>${esc(x)}</li>`).join("")}${pf.calib > 1.5 ? `<li>Tende a se achar mais pronto do que a nota mostra: valide a execução antes de reduzir o acompanhamento.</li>` : pf.calib < -1.5 ? `<li>Tende a se subestimar: reconheça os acertos e aumente a autonomia gradualmente.</li>` : ""}${pf.duv != null && pf.duv < 0.5 && pf.mods >= 2 ? `<li>Quase não registra dúvidas: pergunte ativamente na conversa semanal.</li>` : ""}</ul>` : ""}`}</div>
    ${comp}`, { ativo: "indicadores", sub: "Evolução, curva de aprendizagem e leitura de perfil." });
}

function telaAvaliacoes() {
  const pend = pendencias(); const feitos = [];
  for (const e of S.db.estagiarios) { for (const m of MODS) for (const t of (prog(e.id, m.id)?.tentativas || [])) if (t.status === "avaliada") feitos.push({ e, rot: `${m.id} · ${m.titulo}`, tipo: "Teste", nota: t.nota, ok: t.aprovado, em: t.avaliadoEm, link: `#/tentativa/${e.id}/${m.id}/${t.id}` });
    for (const f of C.fases) for (const x of (faseReg(e.id, f.n)?.entregas || [])) if (x.status === "avaliada") feitos.push({ e, rot: `Fase ${f.n} · ${f.apresentacao.titulo}`, tipo: "Apresentação", nota: x.nota, ok: x.aprovado, em: x.avaliadoEm, link: `#/fase/${e.id}/${f.n}` }); }
  feitos.sort((a, b) => (b.em || "").localeCompare(a.em || ""));
  return shell("Avaliações", `
    <h2>Testes para corrigir</h2>${pend.testes.length ? `<div class="tabela-wrap"><table><thead><tr><th>Enviado</th><th>Estagiário</th><th>Módulo</th><th>Tentativa</th><th></th></tr></thead><tbody>${pend.testes.map(({ e, m, t }) => `<tr><td>${fmtHora(t.enviadoEm)}</td><td>${esc(e.nome)}</td><td>${m.id} · ${esc(m.titulo)}</td><td>${t.n}ª</td><td><a class="btn mini" href="#/avaliar/${e.id}/${m.id}/${t.id}">Corrigir</a></td></tr>`).join("")}</tbody></table></div>` : `<div class="vazio">Nenhum teste pendente.</div>`}
    <h2>Apresentações de fase</h2>${pend.entregas.length ? `<div class="tabela-wrap"><table><thead><tr><th>Entregue</th><th>Estagiário</th><th>Fase</th><th>Versão</th><th></th></tr></thead><tbody>${pend.entregas.map(({ e, f, x }) => `<tr><td>${fmtHora(x.enviadoEm)}</td><td>${esc(e.nome)}</td><td>Fase ${f.n} · ${esc(f.apresentacao.titulo)}</td><td>${x.n}ª</td><td><a class="btn mini" href="#/entrega/${e.id}/${f.n}/${x.id}">Abrir e avaliar</a></td></tr>`).join("")}</tbody></table></div>` : `<div class="vazio">Nenhuma apresentação pendente.</div>`}
    <h2>Histórico</h2>${feitos.length ? `<div class="tabela-wrap"><table><thead><tr><th>Avaliado</th><th>Estagiário</th><th>Item</th><th>Tipo</th><th>Nota</th><th>Resultado</th></tr></thead><tbody>${feitos.slice(0, 60).map(f => `<tr><td>${fmtHora(f.em)}</td><td>${esc(f.e.nome)}</td><td><a href="${f.link}">${esc(f.rot)}</a></td><td>${f.tipo}</td><td><b>${nota1(f.nota)}</b></td><td>${f.ok ? `<span class="st st-aprovado">Aprovado</span>` : `<span class="st st-reciclagem">Refazer</span>`}</td></tr>`).join("")}</tbody></table></div>` : `<div class="vazio">Sem histórico ainda.</div>`}`,
    { ativo: "avaliacoes", sub: "Testes: as objetivas chegam corrigidas. Apresentações: abra o material, assista e pontue pela rubrica." });
}
function telaAvaliar(eid, mid, tid) {
  const e = est(eid), m = modPorId(mid), p = prog(eid, mid), t = p?.tentativas?.find(x => x.id === tid);
  if (!e || !m || !t) return shell("Tentativa não encontrada", `<a class="btn" href="#/avaliacoes">Voltar</a>`, { ativo: "avaliacoes" });
  if (t.status !== "pendente") return telaTentativa(eid, mid, tid);
  const aj = ajuste(eid, mid);
  const qs = t.questoes.map((q, i) => { const r = t.respostas[q.id];
    const bloco = q.tipo === "mc" ? q.opcoes.map((o, k) => `<div class="opcao ${k === q.correta ? "certa" : k === Number(r) ? "errada" : ""}" style="cursor:default"><span>${k === Number(r) ? "●" : "○"}</span><span>${esc(o)}${k === q.correta ? " <b>(correta)</b>" : ""}</span></div>`).join("") + `<div class="notaq">Nota automática: <b>${t.notas[q.id]?.nota ?? 0} de ${q.peso}</b></div>`
      : `<div class="resposta">${esc(r?.texto || "(sem resposta)")}</div>${r?.link ? `<p class="peq">Evidência: <a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.link)}</a></p>` : ""}<div class="gabarito"><b>O que se espera</b>${esc(q.esperado || "—")}</div><div class="notaq"><label for="nq-${q.id}" style="margin:0">Nota (0 a ${q.peso})</label><input id="nq-${q.id}" type="number" min="0" max="${q.peso}" step="0.5" data-nota="${q.id}"></div>`;
    return `<div class="questao"><div class="qh"><span class="qn">Questão ${i + 1}</span><span class="qt">${{ mc: "Objetiva", aberta: "Dissertativa", pratica: "Prática" }[q.tipo]} · peso ${q.peso}</span></div><div class="enun">${esc(q.enunciado)}</div>${bloco}<label for="cq-${q.id}">Comentário (opcional)</label><textarea id="cq-${q.id}" data-coment="${q.id}" style="min-height:56px"></textarea></div>`; }).join("");
  return shell(`Corrigir teste ${m.id}`, `
    <div class="faixa">${esc(e.nome)} · ${esc(m.titulo)} · ${t.n}ª tentativa em ${fmtHora(t.enviadoEm)}. Nota mínima: ${nota1(aj.notaMin)}.</div>
    ${t.relatorio ? `<details class="acc" open><summary>Relatório do módulo escrito pelo estagiário</summary><div class="corpo">${blocoRelato(t.relatorio)}</div></details>` : ""}
    ${p.anotacoes ? `<details class="acc"><summary>Anotações do estagiário</summary><div class="corpo" style="white-space:pre-wrap">${esc(p.anotacoes)}</div></details>` : ""}${qs}
    <div class="resultado"><div class="nota" id="nota-prev">—</div><div><div class="rot" id="rot-prev">Preencha as notas</div><div class="peq">Aprovado, o módulo é concluído e o próximo é liberado.</div></div></div>
    <div class="painel"><label for="av-dom">Nível de domínio validado</label><select id="av-dom">${C.niveis.map(n => `<option ${n === p.dominio ? "selected" : ""}>${n}</option>`).join("")}</select>
      <label for="av-fb">Feedback geral</label><textarea id="av-fb" placeholder="O que foi bem, o que precisa melhorar, como estudar para a próxima etapa."></textarea>
      <div id="av-recic" hidden><label for="av-h">Horas de reciclagem antes do novo teste</label><input id="av-h" type="number" min="1" max="30" step="0.5" value="2" style="max-width:140px"></div>
      <div class="acoes"><button class="btn" data-acao="enviar-avaliacao" data-est="${eid}" data-mod="${mid}" data-tent="${tid}" data-min="${aj.notaMin}">Enviar correção</button></div></div>`, { volta: ["#/avaliacoes", "Avaliações"], ativo: "avaliacoes" });
}
function blocoRelato(rel) {
  if (!rel) return "";
  return `<h3>Como foi o processo de aprendizagem</h3><div class="texto-livre">${esc(rel.processo)}</div><h3>Principais dificuldades</h3><div class="texto-livre">${esc(rel.dificuldades)}</div>
    ${rel.superacao ? `<h3>O que fez para superar</h3><div class="texto-livre">${esc(rel.superacao)}</div>` : ""}
    <p><b>Horas dedicadas (declaradas):</b> ${rel.horas ? fmtH(rel.horas) : "—"} · <b>Segurança para executar sozinho:</b> ${rel.confianca ? rel.confianca + " de 5" : "—"}</p>`;
}
function telaAvaliarEntrega(eid, n, xid) {
  n = Number(n); const e = est(eid), f = faseDe(n), reg = faseReg(eid, n), x = reg?.entregas?.find(z => z.id === xid);
  if (!e || !f || !x) return shell("Entrega não encontrada", `<a class="btn" href="#/avaliacoes">Voltar</a>`, { ativo: "avaliacoes" });
  if (x.status !== "pendente") return telaFase(eid, n);
  const nt = media(escopoFase(eid, n).map(m => prog(eid, m.id)?.notaTeste).filter(v => v != null));
  return shell(`Avaliar apresentação · Fase ${n}`, `
    <div class="faixa">${esc(e.nome)} · ${esc(f.apresentacao.titulo)} · ${x.n}ª versão entregue em ${fmtHora(x.enviadoEm)}. Nota mínima: ${nota1(S.db.config.notaMinIT)}.</div>
    <h2>Material entregue</h2>${blocoArquivos(x)}${x.obs ? `<h3>Observações do estagiário</h3><div class="texto-livre">${esc(x.obs)}</div>` : ""}
    <h3>Roteiro esperado</h3><ol class="lista">${f.apresentacao.roteiro.map(r => `<li>${esc(r)}</li>`).join("")}</ol>
    <h2>Avaliação da apresentação</h2><div class="painel"><label for="ap-data">Data da apresentação</label><input id="ap-data" type="date" value="${hoje()}" style="max-width:200px">
      <div class="rubrica" style="margin-top:14px">${RUBRICA.map(r => `<div><b>${r.nome}</b> <span class="peq sub">(${Math.round(r.peso * 100)}%)</span><small>${r.desc}</small></div><input type="number" min="0" max="10" step="0.5" data-rub="${r.k}" aria-label="${r.nome}">`).join("")}</div></div>
    <div class="resultado"><div class="nota" id="nota-prev">—</div><div><div class="rot" id="rot-prev">Preencha a rubrica</div><div class="peq">Nota da fase = ${Math.round(S.db.config.pesoTeste * 100)}% média dos testes (${nota1(nt)}) + ${Math.round((1 - S.db.config.pesoTeste) * 100)}% apresentação</div></div></div>
    <div class="painel"><label for="ap-fb">Feedback da apresentação</label><textarea id="ap-fb"></textarea>
      <div id="ap-aj" hidden><label for="ap-h">Horas para ajustar a apresentação</label><input id="ap-h" type="number" min="0.5" max="20" step="0.5" value="2" style="max-width:140px"></div>
      <div class="acoes"><button class="btn" data-acao="avaliar-entrega" data-est="${eid}" data-fase="${n}" data-ent="${xid}">Registrar avaliação</button></div></div>`, { volta: ["#/avaliacoes", "Avaliações"], ativo: "avaliacoes" });
}

function telaConteudo() {
  const tot = MODS.reduce((a, m) => a + m.horasEstudo, 0) + C.fases.reduce((a, f) => a + f.horasApresentacao, 0);
  return shell("Conteúdo da trilha", `<p class="sub">${fmtH(tot)} no total. Com a capacidade atual (${fmtH(horasSemana())}/semana), a trilha leva cerca de ${Math.ceil(tot / Math.max(horasSemana(), 0.1))} semanas, sem contar os feriados.</p>` + C.fases.map(f => `<h2>Fase ${f.n} · ${esc(f.nome)}</h2><p>${esc(f.objetivo)}</p><p><b>Critério de saída:</b> ${esc(f.criterio)}</p>
    <div class="estacoes">${modsFase(f.n).map(m => `<a class="estacao" href="#/modulo/${m.id}"><span class="cod">${m.id} · ${fmtH(m.horasEstudo)}</span><span class="tit">${esc(m.titulo)}</span><span class="peq sub">${m.questoes.length} questões</span></a>`).join("")}
      <div class="estacao feito"><span class="cod">Apresentação · ${fmtH(f.horasApresentacao)}</span><span class="tit">${esc(f.apresentacao.titulo)}</span><a class="peq" href="${esc(f.apresentacao.modelo)}" download>Baixar modelo (.pptx)</a></div></div>`).join(""),
    { ativo: "conteudo", sub: "Para editar textos e horas-padrão, altere curriculo.js. Para um estagiário específico, use Ajustar no acompanhamento." });
}

function telaGestor() {
  const ests = ativos(); const tot = ests.reduce((a, e) => a + indicadores(e.id).aprov, 0);
  const mg = media(ests.map(e => indicadores(e.id).mediaFinal).filter(x => x != null));
  const cards = ests.map(e => { const ind = indicadores(e.id); const m = moduloAtual(e.id); const fp = fasePendente(e.id); const pc = ind.total ? Math.round(ind.aprov / ind.total * 100) : 0;
    const concl = MODS.filter(x => prog(e.id, x.id)?.status === "aprovado");

      ${concl.length ? `<div class="tabela-wrap"><table><thead><tr><th>Módulo concluído</th><th>Concluído em</th><th>Nota</th><th></th></tr></thead><tbody>${concl.map(x => { const p = prog(e.id, x.id); return `<tr><td>${x.id} · ${esc(x.titulo)}</td><td>${fmt(p.aprovadoEm)}</td><td><b>${nota1(p.notaTeste)}</b></td><td>${p.tentativas?.some(t => t.relatorio) ? `<a href="#/relatorio/${e.id}/${x.id}">Relatório</a>` : ""}</td></tr>`; }).join("")}</tbody></table></div>` : ""}</div>`; }).join("");
  return shell("Visão do gestor", `<div class="grade g3"><div class="num"><div class="v">${ests.length}</div><div class="l">Estagiários em imersão</div></div><div class="num"><div class="v">${tot}</div><div class="l">Módulos concluídos no total</div></div><div class="num"><div class="v">${nota1(mg)}</div><div class="l">Nota média geral</div></div></div>
    <h2>Progresso por estagiário</h2>${cards || `<div class="vazio">Nenhum estagiário em imersão.</div>`}

    { ativo: "gestor", sub: "Acompanhamento da imersão dos estagiários do GFC. Somente leitura." });
}

function telaTrilha() {
  const eid = S.user.id; const e = est(eid); const ind = indicadores(eid); const fp = fasePendente(eid); const m = moduloAtual(eid); const s = m ? situacao(eid, m.id) : null;
  let proximo, tituloAgora, anel;
  if (fp) { const fs = faseSit(eid, fp.n); tituloAgora = `Fase ${fp.n} · apresentação`; anel = anelPDCA("A", false);

  else if (m) { tituloAgora = `${m.id} · ${esc(m.titulo)}`; anel = anelPDCA(etapaPDCA(s.st), false);
    proximo = { disponivel: `<p>Próximo módulo: <b>${esc(m.titulo)}</b>. Planejado: ${fmtH(s.aj.horasEstudo)} de estudo.</p><div class="acoes"><a class="btn" href="#/modulo/${m.id}">Abrir módulo</a></div>`,

      reciclagem: `<p>Reciclagem de <b>${esc(m.titulo)}</b>. O teste reabre em <b>${fmt(s.p?.prazo)}</b>.</p><div class="acoes"><a class="btn" href="#/modulo/${m.id}">Revisar o módulo</a></div>`,
      teste: `<p>O teste de <b>${esc(m.titulo)}</b> está liberado. Nota mínima: ${nota1(s.aj.notaMin)}.</p><div class="acoes"><a class="btn" href="#/teste/${m.id}">Fazer o teste</a><a class="btn linha" href="#/modulo/${m.id}">Revisar o módulo</a></div>`,
      avaliacao: `<p>Seu teste de <b>${esc(m.titulo)}</b> está com a instrutora.</p>` }[s.st]; }
  else { tituloAgora = "Trilha concluída"; anel = anelPDCA("A", true); proximo = "<p>Parabéns! Combine com a instrutora a avaliação final.</p>"; }
  const fases = C.fases.map(f => { const fs = faseSit(eid, f.n);

    <h2>Sua trilha</h2><div class="trilho">${fases}</div>`, { ativo: "trilha", sub: "Cada módulo: estudo no site, teste e relatório. Cada fase termina com uma apresentação." });
}

function renderConteudo(blocos) {
  return (blocos || []).map(b => {
    if (b.h) return `<h3>${esc(b.h)}</h3>`;
    if (b.p) return `<p>${esc(b.p)}</p>`;
    if (b.lista) return `<ul class="lista">${b.lista.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (b.tabela) return `<div class="tabela-wrap" style="margin:8px 0 16px"><table><thead><tr>${b.tabela.cab.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.tabela.linhas.map(l => `<tr>${l.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    if (b.nota) return `<div class="aviso info">${esc(b.nota)}</div>`;
    if (b.alerta) return `<div class="atencao"><b>ATENÇÃO:</b> ${esc(b.alerta)}</div>`;
    if (b.linha) return `<ol class="linha-tempo">${b.linha.map(x => `<li><div class="lt-t">${esc(x.t)}</div><div class="lt-m">${esc(x.quando)} · ${esc(x.quem)}</div><div>${esc(x.d)}</div></li>`).join("")}</ol>`;
    if (b.fonte) return `<p class="peq sub" style="margin-top:14px">Fontes: ${esc(b.fonte)}</p>`;
    return "";
  }).join("");
}
function blocoReflexao(eid, mid, rel = {}) {

    <div class="linha-form"><div><label for="rl-h">Horas dedicadas ao módulo (aprox.)</label><input id="rl-h" type="number" min="0" step="0.5" value="${rel.horas ?? ""}"></div>
      <div><label for="rl-c">Quão seguro você se sente neste assunto? (1 a 5)</label><select id="rl-c">${[1, 2, 3, 4, 5].map(n => `<option ${rel.confianca === n ? "selected" : ""}>${n}</option>`).join("")}</select></div></div></div>`;
}
function coletarRelatorio() {
  const r1i = $$("[data-r1]:checked").map(i => Number(i.dataset.r1)); const r2el = $("input[name=r2]:checked");
  return { processo: val("rl-proc"), dificuldades: val("rl-dif"), superacao: val("rl-sup"), horas: Number(val("rl-h")) || null, confianca: Number(val("rl-c")), r1i, r1: r1i.map(i => ITENS_APRENDI[i][0]), r2i: r2el ? Number(r2el.value) : null, r2: r2el ? ITENS_SITUACAO[Number(r2el.value)][0] : null };
}

function telaFase(eid, n) {
  n = Number(n); const f = faseDe(n); const souEst = S.user.tipo === "estagiario"; if (!f) return shell("Fase não encontrada", "", {});

  const mods = modsFase(n).map(m => { const s = situacao(eid, m.id); return `<tr><td>${m.id}</td><td><a href="#/modulo/${m.id}${souEst ? "" : "/" + eid}">${esc(m.titulo)}</a></td><td>${chip(s.st)}</td><td><b>${nota1(s.p?.notaTeste)}</b></td></tr>`; }).join("");
  const podeEnviar = souEst && ["entrega", "ajuste"].includes(fs.st);

  const hist = (reg?.entregas || []).map(x => `<div class="painel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>${x.n}ª versão · ${fmtHora(x.enviadoEm)}</b>${x.status === "avaliada" ? `<span><b>${nota1(x.nota)}</b> ${x.aprovado ? `<span class="st st-aprovado">Aprovada</span>` : `<span class="st st-reciclagem">Ajustar</span>`}</span>` : `<span class="st st-apresentacao">Aguardando apresentação</span>`}</div>
    ${blocoArquivos(x)}${x.status === "avaliada" ? `<div class="rubrica" style="margin:8px 0">${RUBRICA.map(r => `<div>${r.nome}</div><b>${nota1(x.rubrica?.[r.k])}</b>`).join("")}</div>` : ""}${x.feedback ? `<div class="comentario">${esc(x.feedback)}</div>` : ""}

    ${form}${hist ? `<h2>Entregas</h2>${hist}` : ""}`,

}

    const nome = val("n-nome"), email = val("n-email"), inicio = val("n-inicio") || hoje(), pin = val("n-pin");
    if (!nome) return toast("Informe o nome.", true); if (!pinOk(pin)) return toast("O PIN precisa ter de 4 a 8 dígitos.", true);
    const id = "e" + uid(); const h = await hashPin(id, pin);
    salvar(db => { db.estagiarios.push({ id, nome, email, inicio, pinHash: h, ativo: true, criadoEm: new Date().toISOString() }); db.progresso[id] = {}; }, `estagiário cadastrado: ${nome}`, `${nome} cadastrado.`);
  },
  async "salvar-estagiario"(el) {
    const id = el.dataset.est, nome = val("e-nome"), inicio = val("e-inicio"), pin = val("e-pin"); if (pin && !pinOk(pin)) return toast("O PIN precisa ter de 4 a 8 dígitos.", true);
    const h = pin ? await hashPin(id, pin) : null; salvar(db => { const e = db.estagiarios.find(x => x.id === id); if (!e) return; if (nome) e.nome = nome; if (inicio) e.inicio = inicio; if (h) e.pinHash = h; }, `cadastro atualizado: ${nome}`, "Cadastro salvo.");
  },
  "arquivar-estagiario"(el) { if (!confirm("Arquivar este estagiário? O histórico continua na base.")) return; const id = el.dataset.est; salvar(db => { const e = db.estagiarios.find(x => x.id === id); if (e) e.ativo = false; }, "estagiário arquivado", "Arquivado.").then(() => ir("/painel")); },
  "abrir-ajuste"(el) { const r = $("#aj-" + el.dataset.mod); r.hidden = !r.hidden; },
  "salvar-ajuste"(el) {
    const eid = el.dataset.est, mid = el.dataset.mod; const he = Number(val("aj-h-" + mid)), notaMin = Number(val("aj-n-" + mid)), escopo = val("aj-e-" + mid) === "1"; const prazo = $("#aj-p-" + mid)?.value;
    if (!(he > 0) || !(notaMin >= 0 && notaMin <= 10)) return toast("Confira horas e nota mínima.", true);
    salvar(db => { db.ajustes[eid] = db.ajustes[eid] || {}; db.ajustes[eid][mid] = { horasEstudo: he, notaMin, escopo }; const p = db.progresso[eid]?.[mid]; if (p && prazo && ["estudo", "reciclagem"].includes(p.status)) p.prazo = prazo; }, `ajuste ${mid}`, "Ajuste salvo.");
  },
  "liberar-teste"(el) { const { est: eid, mod: mid } = el.dataset; salvar(db => { const p = db.progresso[eid]?.[mid]; if (p) p.liberado = true; }, `teste ${mid} liberado antes do prazo`, "Teste liberado."); },
  reabrir(el) { const { est: eid, mod: mid } = el.dataset; if (!confirm("Reabrir o módulo? O estagiário refaz o teste.")) return; const h = Math.max(1, ajuste(eid, mid).horasEstudo / 2);
    salvar(db => { const p = db.progresso[eid]?.[mid]; if (p) { p.status = "reciclagem"; p.prazo = addHoras(hoje(), h); p.liberado = false; delete p.aprovadoEm; delete p.notaTeste; } }, `módulo ${mid} reaberto`, "Módulo reaberto."); },
  iniciar(el) {
    const mid = el.dataset.mod, eid = S.user.id, aj = ajuste(eid, mid); if (situacao(eid, mid).st !== "disponivel") return toast("Módulo ainda não liberado.", true);
    const prazo = addHoras(hoje(), aj.horasEstudo);
    salvar(db => { db.progresso[eid] = db.progresso[eid] || {}; if (db.progresso[eid][mid]) return; db.progresso[eid][mid] = { status: "estudo", inicio: hoje(), prazo, prazoOriginal: prazo, liberado: false, checklist: {}, dominio: C.niveis[0], anotacoes: "", tentativas: [] }; }, `iniciou ${mid}`, "Módulo iniciado. Bons estudos.");
  },
  "enviar-teste"(el) {
    const mid = el.dataset.mod, eid = S.user.id; const qs = questoesDe(mid); const r = coletarRespostas(); const relatorio = coletarRelatorio();
    const falta = qs.filter(q => q.tipo === "mc" ? r[q.id] === undefined : !(r[q.id]?.texto || "").trim()); if (falta.length) return toast(`Responda todas as questões (${falta.length} em branco).`, true);
    if (relatorio.processo.length < 40 || relatorio.dificuldades.length < 20) { $("#relatorio-modulo")?.scrollIntoView(); return toast("Preencha o relatório do módulo com mais detalhe (processo de aprendizagem e dificuldades).", true); }
    if (!relatorio.r1i.length || relatorio.r2 == null) { $("#relatorio-modulo")?.scrollIntoView(); return toast("Responda às duas perguntas de reflexão do relatório.", true); }
    if (!confirm("Enviar o teste e o relatório? Depois não é possível alterar.")) return;
    const notas = {}; for (const q of qs) if (q.tipo === "mc") notas[q.id] = { nota: r[q.id] === q.correta ? q.peso : 0, auto: true };
    const tid = "t" + uid();
    salvar(db => { const p = db.progresso[eid]?.[mid]; if (!p || p.status === "avaliacao") return; p.tentativas.push({ id: tid, n: p.tentativas.length + 1, enviadoEm: new Date().toISOString(), questoes: qs, respostas: r, notas, relatorio, status: "pendente" }); p.status = "avaliacao"; }, `enviou o teste de ${mid}`, "Teste e relatório enviados.")
      .then(ok => { if (ok) { localStorage.removeItem(K_RASC + eid + mid); ir("/modulo/" + mid); } });
  },
  "enviar-avaliacao"(el) {
    const { est: eid, mod: mid, tent: tid } = el.dataset; const t = tentativaDoBotao(el); const min = Number(el.dataset.min); const notas = JSON.parse(JSON.stringify(t.notas || {}));
    for (const q of t.questoes) { const c = $(`[data-coment="${q.id}"]`)?.value.trim() || ""; if (q.tipo === "mc") { notas[q.id] = { ...(notas[q.id] || { nota: 0 }), coment: c }; continue; } const v = $(`[data-nota="${q.id}"]`).value; if (v === "") return toast("Dê nota a todas as dissertativas e práticas.", true); notas[q.id] = { nota: Math.min(q.peso, Math.max(0, Number(v))), coment: c }; }
    const fb = val("av-fb"); if (!fb) return toast("Escreva o feedback geral.", true);
    const dom = val("av-dom"); const h = Math.max(0.5, Number(val("av-h")) || 2); const nota = calcNota({ questoes: t.questoes, notas }); const ok = nota >= min; const fase = modPorId(mid).fase; const hAp = faseDe(fase).horasApresentacao;
    salvar(db => { const p = db.progresso[eid]?.[mid]; const tt = p?.tentativas.find(x => x.id === tid); if (!tt || tt.status !== "pendente") return;
      Object.assign(tt, { notas, nota, aprovado: ok, notaMin: min, feedback: fb, dominio: dom, status: "avaliada", avaliadoEm: new Date().toISOString() }); p.dominioValidado = dom;
      if (ok) { p.status = "aprovado"; p.notaTeste = nota; p.aprovadoEm = hoje();
        db.fases = db.fases || {}; db.fases[eid] = db.fases[eid] || {};
        if (faseCompletaDB(db, eid, fase) && !db.fases[eid][fase]) db.fases[eid][fase] = { status: "entrega", prazoEntrega: addHoras(hoje(), hAp), entregas: [] }; }
      else { p.status = "reciclagem"; p.prazo = addHoras(hoje(), h); p.liberado = false; tt.novoPrazo = p.prazo; } }, `corrigiu teste ${mid}: ${nota1(nota)}`, ok ? "Teste aprovado. Módulo concluído." : "Reciclagem registrada.")
      .then(r => r && ir("/estagiario/" + eid));
  },
  async "enviar-entrega"(el) {
    const n = Number(el.dataset.fase), eid = S.user.id; const files = [...($("#fx-arq")?.files || [])]; const link = val("fx-link"), obs = val("fx-obs");
    const ult = faseReg(eid, n)?.entregas?.at(-1);
    if (!files.length && !link && !(ult?.arquivos?.length)) return toast("Envie o arquivo da apresentação ou informe um link.", true);
    if (files.some(f => f.size > 15 * 1024 * 1024)) return toast("Cada arquivo pode ter até 15 MB. Use um link para arquivos maiores.", true);
    if (!confirm("Enviar a apresentação para a instrutora?")) return;
    const st = $("#fx-status"); el.disabled = true; const arquivos = [];
    try { const pasta = `entregas/${eid}/F${n}/${Date.now()}`; for (const f of files) { st.textContent = `Enviando ${f.name}…`; const path = await Store.enviarArquivo(`${pasta}-${nomeSeguro(f.name)}`, f); arquivos.push({ nome: f.name, path, tamanho: f.size }); } }
    catch (e) { el.disabled = false; st.textContent = ""; return toast(e.message, true); }
    if (!arquivos.length && ult?.arquivos?.length && !link) arquivos.push(...ult.arquivos);
    const xid = "x" + uid(); const hAp = faseDe(n).horasApresentacao;
    salvar(db => { db.fases = db.fases || {}; db.fases[eid] = db.fases[eid] || {}; const reg = db.fases[eid][n] || (db.fases[eid][n] = { status: "entrega", prazoEntrega: addHoras(hoje(), hAp), entregas: [] });
      if (!["entrega", "ajuste_it"].includes(reg.status)) return; reg.entregas = reg.entregas || []; reg.entregas.push({ id: xid, n: reg.entregas.length + 1, enviadoEm: new Date().toISOString(), arquivos, link, obs, status: "pendente" }); reg.status = "apresentacao"; }, `entregou a apresentação da Fase ${n}`, "Apresentação enviada. Combine o horário com a instrutora.")
      .then(ok => ok && ir("/fase/" + n));
  },
  "avaliar-entrega"(el) {
    const { est: eid, ent: xid } = el.dataset; const n = Number(el.dataset.fase); const rub = {}; let falta = false; $$("[data-rub]").forEach(i => { if (i.value === "") falta = true; rub[i.dataset.rub] = Math.min(10, Math.max(0, Number(i.value))); });
    if (falta) return toast("Preencha todos os critérios da rubrica.", true); const fb = val("ap-fb"); if (!fb) return toast("Escreva o feedback da apresentação.", true);
    const nota = notaRubrica(rub), min = S.db.config.notaMinIT, ok = nota >= min, data = val("ap-data") || hoje(), h = Math.max(0.5, Number(val("ap-h")) || 2);
    salvar(db => { const reg = db.fases?.[eid]?.[n]; const x = reg?.entregas?.find(z => z.id === xid); if (!x || x.status !== "pendente") return;

  "salvar-prazo-fase"(el) { const { est: eid } = el.dataset; const n = Number(el.dataset.fase); const d = val("fx-prazo"); if (!d) return toast("Informe a data.", true); salvar(db => { const reg = db.fases?.[eid]?.[n]; if (reg) reg.prazoEntrega = d; }, `prazo da Fase ${n} ajustado`, "Prazo salvo."); },
  "zerar-progresso"() { if (!confirm("Zerar o progresso de todos os estagiários? Testes, relatórios, apresentações e ajustes serão apagados. Cadastros, dúvidas e conversas ficam.")) return; salvar(db => { db.progresso = {}; db.fases = {}; db.ajustes = {}; db.estagiarios.forEach(e => db.progresso[e.id] = {}); db.versao = 4; }, "progresso zerado (reestruturação v4)", "Progresso zerado."); },
  "marcar-v4"() { salvar(db => { db.versao = 4; }, "base marcada como v4"); },
  async baixar(el) { if (!Store.gh()) return toast("Download disponível com a base no GitHub.", true); try { toast("Baixando…"); await Store.baixarArquivo(el.dataset.path, el.dataset.nome); } catch (e) { toast(e.message, true); } },
  "enviar-duvida"() {

  "salvar-encontro"() { const estId = val("en-est"), data = val("en-data") || hoje(), gatilho = val("en-gat"), revisao = val("en-rev"), prioridades = val("en-pri"); if (!revisao) return toast("Registre a revisão.", true); salvar(db => { db.encontros.unshift({ id: "c" + uid(), estId, data, gatilho, revisao, prioridades }); db.encontros.sort((a, b) => b.data.localeCompare(a.data)); }, "conversa semanal registrada", "Conversa registrada."); },
  "apagar-encontro"(el) { if (!confirm("Apagar este registro?")) return; const id = el.dataset.id; salvar(db => { db.encontros = db.encontros.filter(x => x.id !== id); }, "conversa apagada"); },
  "toggle-questao"(el) { const q = el.dataset.q; salvar(db => { if (db.questoesOff[q]) delete db.questoesOff[q]; else db.questoesOff[q] = true; }, `questão ${q} alterada`); },
  "apagar-questao"(el) { if (!confirm("Excluir esta questão?")) return; const { mod, q } = el.dataset; salvar(db => { db.questoesExtras[mod] = (db.questoesExtras[mod] || []).filter(x => x.id !== q); }, `questão ${q} excluída`); },
  "add-questao"(el) {
    const mid = el.dataset.mod; const tipo = val("nq-t-" + mid), peso = Math.max(1, Number(val("nq-p-" + mid)) || 1), enunciado = val("nq-e-" + mid), g = val("nq-g-" + mid), e = val("nq-e2-" + mid); if (!enunciado) return toast("Escreva o enunciado.", true);

  "salvar-capacidade"() { const capN = {}; for (const d of [1, 2, 3, 4, 5]) capN[d] = Math.max(0, Number(val("cap-" + d)) || 0); if (Object.values(capN).reduce((a, b) => a + b, 0) <= 0) return toast("Informe ao menos um dia com horas de estudo.", true);

    const peso = Math.min(100, Math.max(0, Number(val("cf-peso")))) / 100, minIT = Number(val("cf-minit")); salvar(db => { db.config.capacidade = capN; db.config.feriados = fer; db.config.pesoTeste = peso; db.config.notaMinIT = minIT; }, "calendário de estudo atualizado", "Configuração salva. Novos prazos já usam estas horas e feriados."); },
  async "salvar-gestor"() { const nome = val("g-nome"), pin = val("g-pin"); if (pin && !pinOk(pin)) return toast("O PIN precisa ter de 4 a 8 dígitos.", true); if (!pin && !S.db.config.gestorPinHash) return toast("Defina um PIN para o gestor.", true); const h = pin ? await hashPin("gestor", pin) : null; salvar(db => { db.config.gestorNome = nome; if (h) db.config.gestorPinHash = h; }, "acesso do gestor atualizado", "Acesso do gestor salvo."); },
  async "salvar-config"() { const modo = $("input[name=modo]:checked").value; const c = { modo, owner: val("c-owner"), repo: val("c-repo"), branch: val("c-branch") || "main", path: val("c-path") || "data/db.json", token: val("c-token") }; if (modo === "github" && (!c.owner || !c.repo || !c.token)) return toast("Preencha usuário, repositório e token.", true); Store.salvarCfg(c); toast("Configuração salva. Reconectando…"); setTimeout(() => location.reload(), 600); },
  async "testar-config"() {
    const c = { owner: val("c-owner"), repo: val("c-repo"), branch: val("c-branch") || "main", path: val("c-path") || "data/db.json", token: val("c-token") }; const out = $("#c-res"); out.innerHTML = `<div class="aviso info">Testando…</div>`;
    try { const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`, { headers: Store.hdr(c), cache: "no-store" }); if (!r.ok) throw new Error(r.status === 404 ? "Repositório não encontrado ou sem acesso com este token." : `GitHub respondeu ${r.status}.`);
      const j = await r.json(); const rb = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/branches/${encodeURIComponent(c.branch)}`, { headers: Store.hdr(c), cache: "no-store" }); if (rb.status === 404) throw new Error(`A branch "${c.branch}" não existe. Crie-a no GitHub ou corrija o nome.`);
      const { db } = await Store.ghGet(c); out.innerHTML = `<div class="aviso ok">Conectado a <b>${esc(j.full_name)}</b> (${j.private ? "privado" : "público"}), branch <b>${esc(c.branch)}</b>. ${db ? `Base encontrada com ${db.estagiarios?.length || 0} estagiário(s).` : "A base será criada na primeira gravação."}</div>`; }
    catch (e) { out.innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; }

  exportar() { const blob = new Blob([JSON.stringify(S.db, null, 1)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `trilha-gfc-base-${hoje()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); },
  importar(el) { const f = el.files?.[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { let n; try { n = migrar(JSON.parse(rd.result)); if (!Array.isArray(n.estagiarios)) throw 0; } catch { return toast("Arquivo inválido.", true); } if (!confirm("Substituir a base atual?")) return; salvar(db => { Object.keys(db).forEach(k => delete db[k]); Object.assign(db, n); }, "base importada", "Base importada."); }; rd.readAsText(f); },
  async "salvar-perfil"() { const nome = val("p-nome"), pin = val("p-pin"); if (pin && !pinOk(pin)) return toast("O PIN precisa ter de 4 a 8 dígitos.", true); const h = pin ? await hashPin("instrutor", pin) : null; salvar(db => { if (nome) db.instrutor.nome = nome; if (h) db.instrutor.pinHash = h; }, "perfil atualizado", "Perfil salvo."); }
};

window.addEventListener("hashchange", render);
window.addEventListener("beforeunload", e => { if (fila.length) { e.preventDefault(); e.returnValue = ""; } });
(async function iniciar() {
  try { S.user = JSON.parse(sessionStorage.getItem(K_SES) || "null"); } catch { S.user = null; }
  try { await Store.carregar(); } catch (e) { console.error(e); S.erroCarga = e.message || String(e); }
